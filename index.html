<style>
/* Layout: full-bleed 3D viewport; a mission top bar across the top, crew + site panel on the left,
   a contact card bottom-right, and dark label pills floating over the world */
:root{
  --ground:#1c0e07;
  --panel:rgba(19,31,39,.92);
  --panel-2:rgba(30,49,59,.92);
  --bar-top:rgba(15,25,31,.96);
  --bar-bot:rgba(15,25,31,.78);
  --line:rgba(150,196,202,.22);
  --line-strong:rgba(190,220,224,.55);
  --amber:#e9b06a;
  --mint:#7fe6c4;
  --text:#eaf1f0;
  --muted:#a3b6b8;
  --f-display:'Saira Condensed','Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-data:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ground);color:var(--text);font-family:var(--f-body);-webkit-user-select:none;user-select:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#scene.dragging{cursor:grabbing}
#veil{position:fixed;inset:0;background:var(--ground);z-index:30;pointer-events:none;transition:opacity 1.1s ease}
#veil.gone{opacity:0}
.h{margin:0;font-family:var(--f-display);font-weight:600;font-size:12.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--amber)}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}

/* ---------- top bar ---------- */
#topbar{position:fixed;left:0;right:0;top:0;z-index:8;display:flex;align-items:center;gap:28px;
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:10px;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,var(--bar-top),var(--bar-bot));border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand .mark{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber);white-space:nowrap}
.brand .base{font-family:var(--f-data);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.stats{display:flex;gap:22px;margin:0 auto 0 12px}
.stats div{display:flex;flex-direction:column;gap:1px}
.stats dt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#d3dcdd}
.stats dd{margin:0;font-weight:600;font-size:21px;line-height:1.1;color:var(--mint);font-variant-numeric:tabular-nums;white-space:nowrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{cursor:pointer;background:rgba(10,20,26,.7);border:1px solid var(--line-strong);border-radius:4px;padding:6px 11px;font-size:12px;font-weight:500;white-space:nowrap;transition:background .2s,border-color .2s,color .2s}
.btn:hover{background:rgba(255,255,255,.07)}
.btn.on{border-color:var(--mint);color:var(--mint);background:rgba(127,230,196,.12)}

/* ---------- HUD grid below the bar ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;box-sizing:border-box;
  padding-top:calc(max(10px,env(safe-area-inset-top,0px)) + 76px);padding-bottom:max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto 1fr auto;gap:14px;
  grid-template-areas:"side . ." "side . ." "side hint near"}
.panel{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(20,8,2,.3)}

.side{grid-area:side;align-self:start;width:252px;max-height:100%;overflow:auto;display:flex;flex-direction:column;box-sizing:border-box;scrollbar-width:thin}
.side section{padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px}
.side section + section{border-top:1px solid var(--line)}
.side .lead{margin:0;font-size:13px;line-height:1.45;color:#cfdadb}
.crew-list{display:flex;flex-direction:column;gap:7px}
.crew-card{cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 10px;text-align:left;
  background:var(--panel-2);border:1px solid transparent;border-radius:4px;transition:border-color .2s,background .2s}
.crew-card:hover{border-color:var(--line-strong)}
.crew-card.active{border-color:var(--mint);background:rgba(127,230,196,.1)}
.helm{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 40%,#d9d6d0 75%);position:relative;box-shadow:0 0 0 2px var(--acc)}
.helm::after{content:"";position:absolute;left:5px;right:4px;top:8px;height:9px;border-radius:6px 6px 8px 8px;background:linear-gradient(160deg,#3b4656,#11161e 60%)}
.crew-txt{display:flex;flex-direction:column;min-width:0}
.crew-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crew-role{font-size:11px;color:var(--acc);letter-spacing:.06em}
.crew-status{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.crew-card.active .crew-status{color:var(--mint)}
#debug{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:96px;z-index:9;margin:0;max-width:min(470px,calc(100% - 32px));max-height:calc(100% - 120px);overflow:auto;padding:12px 14px;background:rgba(8,14,18,.92);border:1px solid var(--line);border-radius:6px;font:11px/1.45 var(--f-data);color:var(--mint);white-space:pre-wrap;pointer-events:none}
.key{font-family:var(--f-data);font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:1px 5px}
.crew-card.active .key{color:var(--mint);border-color:rgba(127,230,196,.5)}
.outpost-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;color:#d3dcdd}
.outpost-row b{font-family:var(--f-data);font-weight:500;font-size:12px;color:var(--mint);font-variant-numeric:tabular-nums}
.power-cells{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:0 4px}
.power-cells i{height:18px;transform:skewX(-20deg);border-radius:2px;background:rgba(127,230,196,.12);border:1px solid rgba(127,230,196,.22);transition:background .35s,box-shadow .35s}
.power-cells i.on{background:linear-gradient(180deg,#a8f5dc,var(--mint));border-color:var(--mint);box-shadow:0 0 10px rgba(127,230,196,.55)}
.life-track{position:relative;height:10px;border-radius:999px;background:rgba(255,255,255,.1);margin:4px 7px 2px}
.life-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#5fcff0,var(--mint));transition:width .5s ease}
.life-thumb{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--text);border:3px solid var(--mint);box-sizing:border-box;box-shadow:0 0 8px rgba(127,230,196,.5);transition:left .5s ease}
.health-btn{cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);font-size:12.5px;font-weight:600;text-align:left}
.health-btn:hover{border-color:var(--line-strong)}
.health-btn .avg{margin-left:auto}
.health-btn svg{width:12px;height:12px;transition:transform .25s}
.health-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.health-list{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;animation:dg-drop .25s ease}
@keyframes dg-drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.health-list li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;background:rgba(255,255,255,.03);font-size:12px}
.health-list .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none}
.health-list .who{display:flex;flex-direction:column;min-width:0}
.health-list .who span:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.health-list .who span:last-child{font-size:10.5px;color:var(--acc)}
.pill{margin-left:auto;padding:2px 8px;border-radius:999px;font-family:var(--f-data);font-size:11px;font-weight:500;font-variant-numeric:tabular-nums;color:#06261c;background:var(--mint)}
.pill.mid{background:var(--amber);color:#3a2408}
.pill.low{background:#ff6b5e;color:#3a0b06}
.side .foot{padding:12px 16px;border-top:1px solid var(--line);font-family:var(--f-display);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber)}

.near{grid-area:near;align-self:end;justify-self:end;width:290px;padding:16px 18px 16px;display:flex;flex-direction:column;gap:8px;
  opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s;pointer-events:none}
.near.on{opacity:1;transform:none}
.near .ttl{font-weight:600;font-size:20px;line-height:1.2;text-wrap:balance}
.near p{margin:0;font-size:13.5px;line-height:1.5;color:#cfdadb}
.near .tip{margin-top:4px;padding-top:9px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}

.hint{grid-area:hint;align-self:end;justify-self:center;pointer-events:none;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;
  padding:8px 14px;border-radius:6px;background:rgba(15,25,31,.72);border:1px solid var(--line);font-size:12px;color:#d3dcdd;max-width:620px}
.hint span{white-space:nowrap}
kbd{font-family:var(--f-data);font-size:10.5px;color:var(--text);background:rgba(255,255,255,.07);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;margin-right:4px}

/* floating world labels */
#labels{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.wl{position:absolute;left:0;top:0;padding:5px 10px;border-radius:4px;background:rgba(22,34,41,.88);border:1px solid var(--line);
  font-size:12px;font-weight:500;color:var(--text);white-space:nowrap;will-change:transform,opacity;transform-origin:50% 100%}
.wl.crew{font-size:11.5px;color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}

#toast{position:fixed;left:50%;top:26%;transform:translate(-50%,-6px);pointer-events:none;z-index:6;text-align:center;opacity:0;transition:opacity .4s,transform .4s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast .t1{font-family:var(--f-display);font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--amber);text-shadow:0 1px 8px rgba(40,12,0,.5)}
#toast .t2{font-family:var(--f-display);font-weight:700;font-size:34px;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 2px 18px rgba(40,12,0,.55)}
#toast .t3{font-size:13px;color:var(--text);opacity:.9;text-shadow:0 1px 8px rgba(40,12,0,.6)}
#fps{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:96px;font-family:var(--f-data);font-size:11px;color:var(--mint);background:var(--panel);border:1px solid var(--line);padding:3px 7px;border-radius:3px;z-index:9}

#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:1px solid var(--line-strong);background:rgba(15,25,31,.35);z-index:7;pointer-events:none;opacity:0;transition:opacity .15s}
#joy.on{opacity:1}
#joyKnob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(127,230,196,.28);border:1px solid var(--mint)}
#btnJump{display:none;position:fixed;right:max(22px,calc(env(safe-area-inset-right,0px) + 22px));bottom:max(150px,calc(env(safe-area-inset-bottom,0px) + 150px));width:68px;height:68px;border-radius:50%;
  border:1px solid var(--mint);background:rgba(15,25,31,.7);color:var(--mint);font-family:var(--f-display);font-weight:600;letter-spacing:.18em;font-size:13px;text-transform:uppercase;z-index:7;touch-action:none;pointer-events:auto}
#btnJump:active{background:rgba(127,230,196,.22)}
.touch #btnJump{display:block}
.touch .hint,.touch #btnLook{display:none}

@media (max-width:1180px){ .stats .opt{display:none} .stats{gap:16px} }
@media (max-width:980px){
  #topbar{gap:14px}
  .stats{margin-left:0}
  .brand .base{display:none}
  .actions #btnHelp{display:none}
}
@media (max-width:760px){
  #topbar{flex-wrap:wrap;gap:6px 14px;padding-bottom:8px}
  .brand .mark{font-size:16px;letter-spacing:.14em}
  .stats{order:3;width:100%;justify-content:space-between;gap:8px}
  .stats dt{font-size:9.5px}
  .stats dd{font-size:15px}
  .stats .opt2{display:none}
  .actions{margin-left:auto}
  .actions #btnLook{display:none}
  .btn{padding:5px 8px;font-size:11px}
  #hud{padding-top:calc(max(8px,env(safe-area-inset-top,0px)) + 100px);grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;grid-template-areas:"side" "." "near"}
  .side{width:auto;max-height:none;overflow:visible;background:transparent;border:0;box-shadow:none}
  .side section{padding:0}
  .side section + section,.side .foot,.side .h,.side .lead{display:none}
  .side section.outpost{display:flex;margin-top:6px;padding:8px 10px;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
  .crew-list{flex-direction:row;flex-wrap:wrap;gap:6px}
  .crew-card{grid-template-columns:auto minmax(0,1fr);padding:6px 9px;gap:7px;background:var(--panel);border-color:var(--line)}
  .crew-card .key,.crew-card .crew-role{display:none}
  .helm{width:18px;height:18px}
  .helm::after{left:3px;right:3px;top:6px;height:7px}
  .crew-name{font-size:12px}
  .near{width:auto;justify-self:stretch;margin-bottom:96px;padding:12px 14px}
  .near .ttl{font-size:16px}
  .near p{font-size:12.5px}
  .near .tip{display:none}
  #toast .t2{font-size:26px}
}
@media (prefers-reduced-motion:reduce){ #toast,.near,#veil{transition:none} }
</style>
<style>

   DIGONTO · menu screens, cloud transition, Pip, mute (all prefixed dg-)
   Colours come from THEME (JS) as --dg-* custom properties.
   ===================================================================== */
.dg-stage[hidden]{display:none!important}
.dg-stage{position:fixed;inset:0;z-index:50;overflow:hidden;font-family:var(--dg-font);color:var(--dg-text);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

/* ---------- ScreenBackground ---------- */
.dg-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;
  background:radial-gradient(ellipse 78% 72% at 50% 46%,var(--dg-bg-center) 0%,var(--dg-bg-mid) 52%,var(--dg-bg-edge) 100%)}
.dg-star{position:absolute;border-radius:50%;background:var(--dg-star);opacity:var(--o);animation:dg-twinkle var(--d) ease-in-out var(--delay) infinite alternate}
.dg-sparkle{position:absolute;width:var(--s);height:var(--s);color:var(--dg-sparkle);opacity:var(--o);animation:dg-twinkle var(--d) ease-in-out var(--delay) infinite alternate}
.dg-sparkle svg{display:block;width:100%;height:100%}
@keyframes dg-twinkle{from{opacity:var(--o)}to{opacity:calc(var(--o) * .22)}}
.dg-frame{position:absolute;inset:var(--dg-frame-v) var(--dg-frame-h);border:var(--dg-frame-w) solid var(--dg-frame);border-radius:var(--dg-frame-r)}
.dg-mars{position:absolute;left:var(--dg-mars-x);top:var(--dg-mars-y);width:var(--dg-mars-size);height:var(--dg-mars-size);transform:translate(-50%,-50%)}

/* ---------- shared type + buttons ---------- */
.dg-stage [hidden],.dg-guide [hidden]{display:none!important}
/* glowing heading: the element itself draws the orange outline (fill = stroke colour, so overlapping
   glyph contours never show); ::after lays the cream-to-peach fill exactly on top */
.dg-glow-text{position:relative;display:inline-block;margin:0;font-family:var(--dg-font);font-weight:700;line-height:1.08;white-space:nowrap;
  color:var(--dg-orange);-webkit-text-stroke:max(2.4px,.05em) var(--dg-orange);
  filter:drop-shadow(0 0 .1em var(--dg-glow)) drop-shadow(0 0 .03em var(--dg-glow))}
.dg-glow-text::after{content:attr(data-text);position:absolute;inset:0;-webkit-text-stroke:0;color:transparent;
  background:linear-gradient(180deg,var(--dg-cream) 0%,var(--dg-cream) 42%,var(--dg-peach) 100%);-webkit-background-clip:text;background-clip:text}
.dg-btn{--edge:var(--dg-btn-edge);display:inline-flex;align-items:center;justify-content:center;gap:.4em;box-sizing:border-box;min-height:48px;
  font-family:var(--dg-font);font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--dg-btn-text);
  background:linear-gradient(180deg,var(--dg-mint-hi),var(--dg-mint));border:0;border-radius:.62em;cursor:pointer;
  box-shadow:0 var(--edge) 0 var(--dg-mint-edge),0 calc(var(--edge) + .3em) 1.4em var(--dg-mint-glow);
  transform:translateY(0);transition:transform .12s ease,box-shadow .12s ease,background .2s,color .2s;touch-action:manipulation}
.dg-btn:hover{transform:translateY(-2px);box-shadow:0 calc(var(--edge) + 2px) 0 var(--dg-mint-edge),0 calc(var(--edge) + .5em) 1.8em var(--dg-mint-glow)}
.dg-btn:active{transform:translateY(var(--edge));box-shadow:0 0 0 var(--dg-mint-edge),0 .2em .8em var(--dg-mint-glow)}
.dg-btn:focus-visible,.dg-card:focus-visible,.dg-planet:focus-visible,.dg-round:focus-visible,.dg-range:focus-visible{outline:3px solid var(--dg-mint-hi);outline-offset:4px}
.dg-btn:disabled{cursor:not-allowed;color:var(--dg-disabled-text);background:var(--dg-disabled);box-shadow:0 var(--edge) 0 var(--dg-disabled-edge);transform:none}
.dg-btn-start{position:absolute;left:50%;top:var(--dg-start-y);transform:translate(-50%,-50%);width:clamp(190px,22vw,420px);font-size:clamp(19px,calc(1.6vh + 1vw),34px);padding:.82em 0 .78em;letter-spacing:.28em}
.dg-btn-start:hover{transform:translate(-50%,calc(-50% - 2px))}

.dg-btn-cta{font-size:clamp(17px,2.3vh,22px);padding:.7em 1.6em .66em;letter-spacing:.12em;text-transform:none}
.dg-btn-sm{font-size:16px;padding:.5em 1.4em;min-height:44px;letter-spacing:.16em}
.dg-round{display:grid;place-items:center;width:46px;height:46px;padding:0;border-radius:50%;cursor:pointer;color:var(--dg-cream);
  background:var(--dg-panel);border:2px solid var(--dg-panel-line);font-family:var(--dg-font);font-weight:700;font-size:22px;touch-action:manipulation}
.dg-round:hover{border-color:var(--dg-mint)}
.dg-round svg{width:24px;height:24px}

/* ---------- landing ---------- */
.dg-challenge{position:absolute;left:calc(var(--dg-frame-h) + clamp(14px,2vw,28px));top:calc(var(--dg-frame-v) + clamp(12px,2vh,24px));margin:0;
  font-size:clamp(12px,1.6vh,15px);font-weight:500;letter-spacing:.04em;color:var(--dg-muted)}
.dg-title-wrap{position:absolute;left:50%;top:var(--dg-title-y);transform:translate(-50%,-50%);font-size:min(var(--dg-title-vh),16.5vw)}
.dg-title{font-size:1em;letter-spacing:.01em}
.dg-rover{position:absolute;right:var(--dg-rover-right);bottom:var(--dg-rover-bottom);width:var(--dg-rover-w);overflow:visible;animation:dg-bob 2.6s ease-in-out infinite}
.dg-rover .eyes{transform-box:fill-box;transform-origin:center;animation:dg-blink 4.6s infinite}
.dg-rover .tip{transform-box:fill-box;transform-origin:center;animation:dg-pulse 1.6s ease-in-out infinite}
@keyframes dg-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}

/* ---------- menu screen layout ---------- */
.dg-content{position:absolute;inset:calc(var(--dg-frame-v) + 2px) calc(var(--dg-frame-h) + 2px);overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column;
  padding:clamp(60px,9vh,96px) clamp(14px,3vw,40px) clamp(20px,4vh,48px);box-sizing:border-box;scrollbar-width:thin}
.dg-inner{margin:auto;display:flex;flex-direction:column;align-items:center;gap:clamp(16px,3vh,32px);width:100%;max-width:1200px}
.dg-heading{font-size:clamp(28px,5.2vh,48px)}
@media (max-width:720px){.dg-content{padding-bottom:calc(var(--dg-pip-size) + 28px)}}

/* ---------- planets ---------- */
.dg-planet-row{display:flex;gap:clamp(20px,8vw,120px);align-items:flex-start;justify-content:center}
.dg-planet{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 22px 22px;border-radius:32px;
  border:2px solid transparent;transition:transform .2s ease,border-color .2s,background .2s,box-shadow .2s;touch-action:manipulation}
.dg-planet:hover,.dg-planet.is-hover{transform:translateY(-4px);border-color:var(--dg-mint);background:rgba(114,230,184,.07);box-shadow:0 0 34px var(--dg-mint-glow)}
.dg-planet-view{width:var(--dg-planet-size);height:var(--dg-planet-size);border-radius:50%;
  background:radial-gradient(circle,var(--glow) 0%,transparent 68%)}
.dg-planet-name{font-size:clamp(30px,5vh,48px)}
.dg-planet-line{font-size:clamp(15px,2.1vh,19px);font-weight:500;color:var(--dg-text-soft);text-align:center}
.dg-planet-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
@media (max-width:640px),(max-aspect-ratio:4/5){.dg-planet-row{flex-direction:column;align-items:center;gap:6px}.dg-planet{padding:10px 20px 14px}}

/* ---------- crew ---------- */
.dg-heading.is-bump{animation:dg-bump .4s ease}
@keyframes dg-bump{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.dg-cards{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(10px,1.4vw,18px)}
.dg-card{all:unset;box-sizing:border-box;position:relative;cursor:pointer;width:clamp(150px,17.5vw,212px);padding:18px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  background:var(--dg-card);border:2px solid var(--dg-panel-line);border-radius:24px;transition:transform .15s ease,border-color .2s,box-shadow .2s,background .2s;touch-action:manipulation}
.dg-card:hover{transform:translateY(-3px);background:var(--dg-card-hover)}
.dg-card[aria-pressed="true"]{border-color:var(--dg-mint);box-shadow:0 0 0 3px rgba(114,230,184,.18),0 0 26px var(--dg-mint-glow)}
.dg-card.is-left{border-color:var(--dg-orange);border-style:dashed;background:rgba(232,116,58,.08)}
.dg-card-icon{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--acc);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.dg-card-icon svg{width:38px;height:38px}
.dg-card-name{font-weight:700;font-size:clamp(17px,2.2vh,21px);line-height:1.15;color:var(--dg-cream)}
.dg-card-job{font-weight:500;font-size:14.5px;line-height:1.35;color:var(--dg-text-soft)}
.dg-card-missing{margin:4px 0 0;padding:8px 10px;border-radius:14px;background:rgba(232,116,58,.16);font-weight:500;font-size:13.5px;line-height:1.35;color:var(--dg-peach)}
.dg-card-missing b{display:block;margin-bottom:2px;font-weight:700;color:var(--dg-orange)}
.dg-check{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:var(--dg-mint);display:none;place-items:center;box-shadow:0 2px 0 var(--dg-mint-edge)}
.dg-check svg{width:16px;height:16px}
.dg-card[aria-pressed="true"] .dg-check{display:grid}

/* ---------- resources ---------- */
.dg-res-panel{position:relative;width:min(880px,100%);box-sizing:border-box;margin-top:22px;padding:clamp(48px,7vh,66px) clamp(18px,4vw,52px) clamp(26px,4vh,40px);
  border:2px solid var(--dg-panel-line);border-radius:34px;background:var(--dg-panel);display:flex;flex-direction:column;gap:clamp(14px,2.4vh,22px)}
.dg-banner{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px}
.dg-banner svg{width:28px;height:32px;flex:none;color:var(--dg-orange)}
.dg-banner svg.flip{transform:scaleX(-1)}
.dg-banner-box{padding:.5em 1.3em .45em;border:2px solid var(--dg-orange);border-radius:8px;background:var(--dg-bg-mid);white-space:nowrap;
  font-weight:700;font-size:clamp(15px,2.4vh,22px);letter-spacing:.2em;color:var(--dg-cream);text-shadow:0 0 12px var(--dg-glow)}
.dg-res-item{display:flex;flex-direction:column;gap:8px}
.dg-res-row{display:flex;align-items:center;gap:clamp(14px,2.6vw,34px)}
.dg-btn-res{width:clamp(230px,28vw,310px);flex:none;font-size:clamp(15px,2.1vh,19px);padding:.85em .6em .8em;letter-spacing:.14em;color:var(--dg-cream);
  background:var(--dg-res-bg);box-shadow:inset 0 0 0 2px var(--dg-mint),0 var(--edge) 0 var(--dg-mint-edge)}
.dg-btn-res:hover{box-shadow:inset 0 0 0 2px var(--dg-mint-hi),0 calc(var(--edge) + 2px) 0 var(--dg-mint-edge),0 0 18px var(--dg-mint-glow)}
.dg-btn-res:active{box-shadow:inset 0 0 0 2px var(--dg-mint),0 0 0 var(--dg-mint-edge)}
.dg-btn-res.is-on{color:var(--dg-btn-text);background:linear-gradient(180deg,var(--dg-mint-hi),var(--dg-mint));box-shadow:0 var(--edge) 0 var(--dg-mint-edge),0 0 22px var(--dg-mint-glow)}
.dg-slider{position:relative;flex:1;min-width:0;padding:4px 0 34px;animation:dg-reveal .3s ease}
@keyframes dg-reveal{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.dg-range{-webkit-appearance:none;appearance:none;display:block;width:100%;height:44px;margin:0;background:transparent;cursor:pointer;touch-action:pan-y}
.dg-range::-webkit-slider-runnable-track{height:14px;border-radius:999px;background:linear-gradient(90deg,var(--dg-mint) 0 var(--pct),var(--dg-track) var(--pct) 100%)}
.dg-range::-moz-range-track{height:14px;border-radius:999px;background:var(--dg-track)}
.dg-range::-moz-range-progress{height:14px;border-radius:999px;background:var(--dg-mint)}
.dg-range::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:-10px;border-radius:50%;background:var(--dg-cream);border:5px solid var(--dg-mint);box-sizing:border-box;box-shadow:0 3px 0 var(--dg-mint-edge),0 0 14px var(--dg-mint-glow)}
.dg-range::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--dg-cream);border:5px solid var(--dg-mint);box-shadow:0 3px 0 var(--dg-mint-edge)}
.dg-thumb-label{position:absolute;bottom:0;left:calc(var(--pct-n) * (100% - 34px) + 17px);transform:translateX(-50%);padding:3px 10px;border-radius:9px;
  background:var(--dg-bg-mid);border:1px solid var(--dg-panel-line);white-space:nowrap;font-weight:700;font-size:14px;letter-spacing:.08em;color:var(--dg-cream);font-variant-numeric:tabular-nums}
.dg-res-help{margin:0;font-size:clamp(14px,2vh,17px);font-weight:500;color:var(--dg-text-soft)}
.dg-cargo{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:18px;background:rgba(8,12,34,.55);border:1px solid var(--dg-panel-line)}
.dg-cargo-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.dg-cargo-top span{font-weight:700;letter-spacing:.16em;font-size:clamp(13px,1.9vh,16px);color:var(--dg-peach)}
.dg-cargo-top b{font-weight:700;font-size:clamp(17px,2.6vh,24px);color:var(--dg-cream);font-variant-numeric:tabular-nums}
.dg-cargo-bar{display:flex;height:18px;border-radius:999px;overflow:hidden;background:var(--dg-track)}
.dg-cargo-bar i{display:block;height:100%;transition:width .35s ease}
.dg-cargo-bar i + i{box-shadow:inset 2px 0 0 rgba(8,12,34,.6)}
.dg-cargo-note{margin:0;min-height:1.3em;font-size:13.5px;font-weight:500;color:var(--dg-peach)}
.dg-opts{flex:1;min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;animation:dg-reveal .3s ease}
.dg-opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:16px;background:var(--dg-card);border:2px solid var(--dg-panel-line);transition:border-color .2s,box-shadow .2s,transform .15s;touch-action:manipulation}
.dg-opt:hover{transform:translateY(-2px)}
.dg-opt:focus-visible{outline:3px solid var(--dg-mint-hi);outline-offset:3px}
.dg-opt[aria-pressed="true"]{border-color:var(--dg-mint);box-shadow:0 0 0 3px rgba(114,230,184,.16),0 0 18px var(--dg-mint-glow)}
.dg-opt-name{font-weight:700;font-size:15px;color:var(--dg-cream)}
.dg-opt-cost{font-weight:700;font-size:12.5px;letter-spacing:.1em;color:var(--dg-orange)}
.dg-opt-trait{font-weight:500;font-size:13px;line-height:1.35;color:var(--dg-text-soft)}
.dg-range.has-limit::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--dg-mint) 0 var(--pct),var(--dg-track) var(--pct) var(--lim),repeating-linear-gradient(135deg,rgba(232,116,58,.55) 0 6px,rgba(232,116,58,.2) 6px 12px) var(--lim) 100%)}
@media (max-width:640px){.dg-opts{grid-template-columns:1fr}}
.dg-res-panel .dg-btn-cta{align-self:center;margin-top:6px}
@media (max-width:640px){.dg-res-row{flex-direction:column;align-items:stretch}.dg-btn-res{width:100%}.dg-banner svg{width:20px}}

/* ---------- Pip (guide) ---------- */
.dg-guide{position:absolute;right:calc(var(--dg-frame-h) + 10px);bottom:calc(var(--dg-frame-v) + 2px);z-index:20;width:var(--dg-pip-size);pointer-events:none}
.dg-guide-avatar{pointer-events:auto;cursor:pointer;width:100%}
.dg-guide-avatar svg,.dg-guide-avatar img{display:block;width:100%;height:auto;animation:dg-bob 3.2s ease-in-out infinite}
.dg-pip .eyes{transform-box:fill-box;transform-origin:center;animation:dg-blink 5.2s infinite}
.dg-guide-help{position:absolute;left:-8px;top:-4px;pointer-events:auto;width:44px;height:44px;font-size:22px;z-index:2}
.dg-guide-panel{position:absolute;right:calc(100% + 12px);bottom:30%;width:min(380px,calc(100vw - var(--dg-pip-size) - 64px));box-sizing:border-box;padding:18px 20px 16px;pointer-events:auto;
  border-radius:24px;background:var(--dg-bubble);color:var(--dg-bubble-text);box-shadow:0 14px 40px rgba(0,0,0,.4);
  transform-origin:100% 85%;transition:transform .28s cubic-bezier(.2,1.35,.45,1),opacity .2s ease,visibility 0s}
.dg-guide-panel::after{content:"";position:absolute;right:-10px;bottom:22px;border:12px solid transparent;border-right:0;border-left-color:var(--dg-bubble)}
.dg-guide-panel.is-closed{transform:scale(.5);opacity:0;visibility:hidden;transition:transform .2s ease,opacity .18s ease,visibility 0s .2s}
.dg-guide-text{margin:0 0 14px;font-size:clamp(16px,2.2vh,19px);font-weight:500;line-height:1.45;-webkit-user-select:text;user-select:text}
.dg-guide-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.dg-guide-listen{color:var(--dg-bubble-text);background:transparent;border-color:rgba(59,42,30,.3)}
@media (max-width:600px){
  .dg-guide-panel{right:0;bottom:calc(100% + 10px);width:calc(100vw - 2 * var(--dg-frame-h) - 28px);transform-origin:90% 100%}
  .dg-guide-panel::after{right:34px;bottom:-10px;border:12px solid transparent;border-bottom:0;border-top-color:var(--dg-bubble)}
}

/* ---------- mute ---------- */
.dg-mute{position:fixed;z-index:900;right:calc(var(--dg-frame-h) + 12px);top:calc(var(--dg-frame-v) + 10px)}
.dg-mute.in-game{right:max(16px,env(safe-area-inset-right,0px));top:var(--dg-mute-top,84px);width:40px;height:40px}

/* ---------- cinematic stages (launch, approach) — panels reuse the 3D game's HUD tokens ---------- */
.dg-cine-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.dg-cine{position:absolute;inset:0;pointer-events:none;z-index:3;font-family:var(--dg-font);color:#fff}
.dg-lower-third{position:absolute;left:max(16px,4vw);bottom:clamp(170px,30vh,260px);display:flex;align-items:center;gap:12px;
  padding:10px 18px 10px 14px;border-radius:10px;background:rgba(8,14,22,.55);font-weight:600;font-size:clamp(18px,2.8vh,28px);letter-spacing:.01em;
  opacity:0;transform:translateX(-14px);transition:opacity .6s ease,transform .6s ease}
.dg-lower-third::before{content:"";width:6px;align-self:stretch;border-radius:3px;background:var(--dg-orange)}
.dg-lower-third.on{opacity:1;transform:none}
.dg-countdown{position:absolute;left:50%;top:clamp(56px,9vh,110px);transform:translateX(-50%);font-size:clamp(64px,15vh,160px);opacity:0}
.dg-countdown.on{opacity:1;animation:dg-count-pop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes dg-count-pop{from{transform:translateX(-50%) scale(1.45);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.dg-cine-title{position:absolute;left:50%;top:clamp(56px,9vh,110px);transform:translateX(-50%);font-size:clamp(30px,6vh,60px)}
.dg-caption{position:absolute;left:50%;bottom:max(16px,4vh);transform:translateX(-50%);width:min(52vw,760px);box-sizing:border-box;margin:0;
  padding:.5em .9em;border-radius:16px;background:rgba(8,14,22,.5);text-align:center;font-weight:600;font-size:clamp(18px,3vh,30px);line-height:1.3;
  text-shadow:0 2px 10px rgba(0,0,0,.5);opacity:0;transition:opacity .35s ease}
.dg-caption.on{opacity:1}
.dg-readout{position:absolute;bottom:max(14px,2.4vh);width:clamp(176px,19vw,250px);display:flex;flex-direction:column;gap:5px}
.dg-readout.left{left:max(14px,2vw)}
.dg-readout.right{right:max(14px,2vw)}
.dg-readout-box{box-sizing:border-box;padding:10px 13px 11px;border-radius:6px;background:var(--panel);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-family:var(--f-body)}
.dg-readout h3{margin:0 0 6px;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber)}
.dg-readout .big{font-family:var(--f-data);font-size:clamp(20px,2.8vh,28px);font-weight:500;color:var(--mint);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.dg-readout dl{display:grid;grid-template-columns:auto auto;gap:3px 12px;margin:6px 0 0;font-size:12px}
.dg-readout dt{color:var(--muted);letter-spacing:.06em}
.dg-readout dd{margin:0;text-align:right;font-family:var(--f-data);font-size:12px;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.dg-readout dd.good{color:var(--mint)}
.dg-readout dd.wait{color:var(--amber)}
.dg-readout dd.idle{color:var(--muted)}
.dg-readout .note{font-family:var(--f-data);font-size:10px;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.dg-readout .tiny{font-family:var(--f-body);font-size:10.5px;color:rgba(230,236,240,.75);padding-left:2px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.dg-flash{position:absolute;inset:0;opacity:0;background:radial-gradient(circle at 50% 70%,rgba(255,255,248,1),rgba(255,236,200,.85) 38%,rgba(255,200,140,.35) 70%,rgba(255,190,130,.1) 100%)}
@media (max-width:760px){
  .dg-readout{width:calc(50vw - 22px)}
  .dg-readout dl{font-size:10.5px;gap:2px 8px}.dg-readout dd{font-size:10.5px}
  .dg-caption{width:calc(100vw - 28px);bottom:calc(max(14px,2.4vh) + 172px)}
  .dg-lower-third{bottom:auto;top:clamp(120px,20vh,180px)}
}
/* white fade between the cinematic stages */
.dg-white{position:fixed;inset:0;z-index:1100;background:var(--dg-white);opacity:0;pointer-events:none;transition-property:opacity;transition-timing-function:ease-in-out}
.dg-white.block{pointer-events:auto}

/* ---------- Sol gameplay UI (inside the 3D game; same tokens as the game HUD) ---------- */
.sol-ui{position:fixed;inset:0;pointer-events:none;z-index:12;font-family:var(--f-body);color:var(--text)}
.sol-stack{position:absolute;left:50%;top:var(--sol-top,84px);transform:translateX(-50%);width:min(680px,calc(100vw - 32px));display:flex;flex-direction:column;align-items:center;gap:8px}
.sol-objective{pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:100%;box-sizing:border-box;padding:7px 8px 7px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line-strong);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:13.5px;font-weight:500}
.sol-objective .lbl{font-family:var(--f-display);font-weight:600;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber);white-space:nowrap}
.sol-objective .txt{min-width:0}
.sol-objective .timer{margin-left:auto;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.08);font-family:var(--f-data);font-size:12.5px;color:var(--mint);font-variant-numeric:tabular-nums;white-space:nowrap}
.sol-objective .timer.low{color:#ff8a7a;background:rgba(255,90,70,.16)}
.sol-warning{pointer-events:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;max-width:100%;box-sizing:border-box;padding:10px 12px 10px 14px;border-radius:10px;
  background:rgba(70,40,8,.9);border:1px solid #f2b45a;box-shadow:0 8px 26px rgba(0,0,0,.35);font-size:14px;font-weight:600;animation:sol-in .35s ease}
.sol-warning.red{background:rgba(92,14,12,.92);border-color:#ff6b5e}
.sol-warning .ico{display:grid;place-items:center;flex:none;width:24px;height:24px;border-radius:50%;background:#f2b45a;color:#2a1600;font-weight:800;animation:sol-pulse 1s ease-in-out infinite}
.sol-warning.red .ico{background:#ff6b5e;color:#2a0300}
.sol-warning .txt{flex:1 1 260px;min-width:0;line-height:1.35}
.sol-btn{pointer-events:auto;cursor:pointer;min-height:36px;padding:7px 14px;border-radius:8px;border:1px solid var(--line-strong);background:rgba(255,255,255,.06);color:var(--text);font:600 13px var(--f-body);white-space:nowrap}
.sol-btn:hover{background:rgba(255,255,255,.12)}
.sol-btn.primary{background:var(--mint);border-color:var(--mint);color:#06261c}
.sol-btn.primary:hover{filter:brightness(1.08)}
.sol-btn.danger{background:#ff6b5e;border-color:#ff6b5e;color:#2a0300}
.sol-btn:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.sol-notify{position:absolute;left:50%;bottom:max(84px,calc(env(safe-area-inset-bottom,0px) + 84px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:min(560px,calc(100vw - 32px))}
.sol-toast{pointer-events:auto;display:flex;align-items:center;gap:10px;box-sizing:border-box;max-width:100%;padding:10px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line-strong);
  box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:14.5px;font-weight:600;line-height:1.35;animation:sol-in .3s ease}
.sol-toast.good{border-color:var(--mint);background:rgba(10,52,40,.92)}
.sol-toast.deny{border-color:#ff6b5e;background:rgba(70,14,12,.92)}
.sol-toast.out{opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
.sol-layer{position:absolute;inset:0;pointer-events:none}
.sol-back{position:absolute;inset:0;pointer-events:auto;background:rgba(6,10,16,.45);display:grid;place-items:center;padding:16px;animation:sol-fade .25s ease}
.sol-modal{pointer-events:auto;box-sizing:border-box;width:min(520px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px 22px 18px;border-radius:14px;background:rgba(10,24,34,.96);border:1px solid var(--line-strong);
  box-shadow:0 18px 50px rgba(0,0,0,.45);animation:sol-pop .3s cubic-bezier(.2,1.3,.4,1)}
.sol-modal.alert{border-color:#f2b45a}
.sol-modal.danger{border-color:#ff6b5e;box-shadow:0 0 0 1px rgba(255,107,94,.3),0 18px 50px rgba(120,10,0,.45)}
.sol-modal.tab{position:absolute;left:50%;top:calc(var(--sol-top,84px) + 104px);transform:translateX(-50%);width:min(440px,calc(100% - 32px));padding:14px 16px 12px;animation:sol-in .3s ease}
.sol-modal .kicker{margin:0 0 6px;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber)}
.sol-modal.danger .kicker{color:#ff8a7a}
.sol-modal h2{margin:0 0 8px;font-family:var(--dg-font,var(--f-body));font-weight:700;font-size:22px;line-height:1.2;color:#fff5e8}

.sol-rating{margin:0 0 14px;font-family:var(--dg-font,var(--f-body));font-weight:700;font-size:26px;color:#fff5e8}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   FRONTIER KIT — canvas textures, materials, geometry helpers and the
   Frontier One shuttle builder. Shared by the 3D game, the launch scene and the
   approach scene, so every shuttle is built by the same code.
   createFrontierKit(THREE, anisotropy) → { Tex, M, mesh, rod, …, buildShuttle }
   ===================================================================== */
function createFrontierKit(T, anisotropy) {
'use strict';
const MAX_ANISO = anisotropy;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const col = (hex) => new T.Color(hex).convertSRGBToLinear();
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* =====================================================================
   TEXTURES — all generated on canvas (decals, hull seams, tiles, cells…)
   ===================================================================== */
function canvasTex(w, h, draw, opts = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new T.CanvasTexture(c);
  if (opts.srgb !== false) t.encoding = T.sRGBEncoding;
  if (opts.wrap !== false) t.wrapS = t.wrapT = T.RepeatWrapping;
  if (opts.repeat) t.repeat.set(opts.repeat[0], opts.repeat[1]);
  t.anisotropy = MAX_ANISO;
  t.sourceCanvas = c;
  return t;
}
const DECAL_FONT = '"Arial Black","Helvetica Neue",Arial,sans-serif';
function spacedText(g, text, x, y, spacing, align = 'center') {
  const widths = [...text].map(ch => g.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + spacing * (text.length - 1);
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  g.textAlign = 'left';
  [...text].forEach((ch, i) => { g.fillText(ch, cx, y); cx += widths[i] + spacing; });
  return total;
}

const Tex = {};
{
  const R = rng(42);
  Tex.sand = canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = '#ece6de'; g.fillRect(0, 0, w, h);
    const img = g.getImageData(0, 0, w, h), d = img.data;
    for (let i = 0; i < d.length; i += 4) { const n = (R() - 0.5) * 16; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
    g.putImageData(img, 0, 0);
    const rows = 22, sp = h / rows;
    for (let r = 0; r < rows; r++) {
      const y0 = r * sp, ph = r * 1.7;
      for (const pass of [0, 1]) {
        g.beginPath();
        for (let x = 0; x <= w; x += 4) {
          const u = x / w * Math.PI * 2;
          const y = y0 + Math.sin(u * 2 + ph) * 5 + Math.sin(u * 5 + ph * 2.3) * 2 + Math.sin(u * 9 + r) * 0.8 + pass * 2.2;
          x === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
        }
        g.strokeStyle = pass ? 'rgba(90,60,40,0.11)' : 'rgba(255,255,255,0.18)';
        g.lineWidth = pass ? 3 : 3.4; g.stroke();
      }
    }
    for (let i = 0; i < 900; i++) { g.fillStyle = R() < 0.5 ? 'rgba(80,50,35,0.28)' : 'rgba(255,250,240,0.35)'; const s = R() * 2.2 + 0.6; g.fillRect(R() * w, R() * h, s, s); }
  }, { repeat: [64, 64] });
  Tex.sandBump = new T.CanvasTexture(Tex.sand.sourceCanvas);
  Tex.sandBump.wrapS = Tex.sandBump.wrapT = T.RepeatWrapping; Tex.sandBump.repeat.set(64, 64); Tex.sandBump.anisotropy = MAX_ANISO;

  Tex.hull = canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = '#f4f1eb'; g.fillRect(0, 0, w, h);
    const img = g.getImageData(0, 0, w, h), d = img.data;
    for (let i = 0; i < d.length; i += 4) { const n = (R() - 0.5) * 6; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
    g.putImageData(img, 0, 0);
    g.strokeStyle = 'rgba(70,72,80,0.30)'; g.lineWidth = 1.5;
    for (let y = 0; y <= h; y += 128) { g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(w, y + 0.5); g.stroke(); }
    for (let row = 0; row < 4; row++) for (let x = (row % 2) * 48; x < w; x += 96) { g.beginPath(); g.moveTo(x + 0.5, row * 128); g.lineTo(x + 0.5, row * 128 + 128); g.stroke(); }
    g.fillStyle = 'rgba(80,82,90,0.22)';
    for (let y = 6; y < h; y += 128) for (let x = 8; x < w; x += 16) { g.beginPath(); g.arc(x, y, 1.1, 0, 7); g.fill(); }
  }, { repeat: [6, 5] });

  Tex.wing = Tex.hull.clone(); Tex.wing.needsUpdate = true; Tex.wing.repeat.set(0.16, 0.16);

  Tex.tiles = canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = '#0d0d0f'; g.fillRect(0, 0, w, h);
    const s = 32;
    for (let y = 0; y < h; y += s) for (let x = 0; x < w; x += s) { const v = 26 + R() * 14; g.fillStyle = `rgb(${v},${v},${v + 2})`; g.fillRect(x + 1.5, y + 1.5, s - 3, s - 3); }
  }, { repeat: [10, 12] });

  Tex.windows = canvasTex(512, 256, (g, w, h) => {
    g.clearRect(0, 0, w, h);
    const n = 6, pad = 40, ww = (w - pad * 2) / n;
    for (let i = 0; i < n; i++) {
      const x0 = pad + i * ww + 6, x1 = x0 + ww - 12, tilt = (i - (n - 1) / 2) * 3;
      g.beginPath(); g.moveTo(x0 + 8 + tilt, 50); g.lineTo(x1 - 8 + tilt, 50); g.lineTo(x1, 200); g.lineTo(x0, 200); g.closePath();
      g.fillStyle = '#d7d4cf'; g.fill();
      g.beginPath(); g.moveTo(x0 + 14 + tilt, 58); g.lineTo(x1 - 14 + tilt, 58); g.lineTo(x1 - 6, 192); g.lineTo(x0 + 6, 192); g.closePath();
      const gr = g.createLinearGradient(0, 58, 0, 192); gr.addColorStop(0, '#26303c'); gr.addColorStop(1, '#0c1016');
      g.fillStyle = gr; g.fill();
    }
  }, { wrap: false });

  Tex.tread = canvasTex(512, 64, (g, w, h) => {
    g.fillStyle = '#1c1c1f'; g.fillRect(0, 0, w, h);
    for (let x = 0; x < w; x += 16) { g.fillStyle = '#2d2d31'; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 9, 0); g.lineTo(x + 13, h / 2); g.lineTo(x + 9, h); g.lineTo(x, h); g.lineTo(x + 4, h / 2); g.closePath(); g.fill(); }
  });

  Tex.cells = canvasTex(256, 352, (g, w, h) => {
    g.fillStyle = '#0a1a3c'; g.fillRect(0, 0, w, h);
    const cx = 6, cy = 8, mw = w / cx, mh = h / cy;
    for (let y = 0; y < cy; y++) for (let x = 0; x < cx; x++) {
      const gr = g.createLinearGradient(x * mw, y * mh, x * mw + mw, y * mh + mh);
      gr.addColorStop(0, '#1d3e7c'); gr.addColorStop(0.55, '#10285a'); gr.addColorStop(1, '#0b1d44');
      g.fillStyle = gr; g.fillRect(x * mw + 2, y * mh + 2, mw - 4, mh - 4);
      g.fillStyle = 'rgba(180,200,230,0.35)'; g.fillRect(x * mw + 2, y * mh + mh * 0.33, mw - 4, 1); g.fillRect(x * mw + 2, y * mh + mh * 0.66, mw - 4, 1);
    }
    g.strokeStyle = '#b8c3d2'; g.lineWidth = 2; g.strokeRect(1, 1, w - 2, h - 2);
  }, { wrap: false });

  Tex.concrete = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#9b938b'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 4000; i++) { const v = 120 + R() * 60; g.fillStyle = `rgba(${v},${v - 6},${v - 12},0.35)`; g.fillRect(R() * w, R() * h, 2, 2); }
    g.strokeStyle = 'rgba(60,55,50,0.4)'; g.lineWidth = 2; g.strokeRect(2, 2, w - 4, h - 4);
    g.fillStyle = 'rgba(70,64,58,0.6)'; for (const [x, y] of [[14, 14], [w - 14, 14], [14, h - 14], [w - 14, h - 14]]) { g.beginPath(); g.arc(x, y, 4, 0, 7); g.fill(); }
  });

  Tex.grating = canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = '#1b1d21'; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#4a4f57'; g.lineWidth = 3;
    for (let i = 0; i <= w; i += 16) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, h); g.stroke(); }
    g.lineWidth = 1.5; for (let i = 0; i <= h; i += 8) { g.beginPath(); g.moveTo(0, i); g.lineTo(w, i); g.stroke(); }
  }, { repeat: [3, 2] });

  Tex.slab = canvasTex(512, 470, (g, w, h) => {
    g.fillStyle = '#a39a90'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 6000; i++) { const v = 130 + R() * 60; g.fillStyle = `rgba(${v},${v - 8},${v - 14},0.3)`; g.fillRect(R() * w, R() * h, 2, 2); }
    g.save(); g.beginPath(); g.rect(0, 0, w, h); g.rect(44, 44, w - 88, h - 88); g.clip('evenodd');
    g.fillStyle = '#1d1e21'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#ee7a2c';
    for (let i = -h; i < w + h; i += 52) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 26, 0); g.lineTo(i + 26 - h, h); g.lineTo(i - h, h); g.closePath(); g.fill(); }
    g.restore();
    g.fillStyle = '#26282c'; g.font = `900 64px ${DECAL_FONT}`; g.textBaseline = 'middle';
    spacedText(g, 'AIRLOCK A', w / 2, h / 2 - 22, 6);
    g.font = `700 22px ${DECAL_FONT}`; g.fillStyle = '#3b3d42';
    spacedText(g, 'FRONTIER ONE · EVA PAD 1', w / 2, h / 2 + 34, 4);
    g.fillStyle = '#ee7a2c'; g.beginPath(); g.moveTo(w / 2, h / 2 + 80); g.lineTo(w / 2 - 26, h / 2 + 110); g.lineTo(w / 2 + 26, h / 2 + 110); g.closePath(); g.fill();
  }, { wrap: false });

  Tex.footprint = canvasTex(64, 128, (g, w, h) => {
    g.clearRect(0, 0, w, h);
    g.fillStyle = 'rgba(0,0,0,0.85)';
    g.beginPath(); g.ellipse(w / 2, 40, 22, 30, 0, 0, 7); g.fill();
    g.beginPath(); g.ellipse(w / 2, 98, 19, 24, 0, 0, 7); g.fill();
    g.globalCompositeOperation = 'destination-out';
    for (let y = 16; y < 124; y += 9) g.fillRect(8, y, w - 16, 3.5);
    g.globalCompositeOperation = 'source-over';
  }, { wrap: false });

  Tex.glow = canvasTex(64, 64, (g, w, h) => {
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,90,70,1)'); gr.addColorStop(0.25, 'rgba(255,50,30,0.55)'); gr.addColorStop(1, 'rgba(255,30,10,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  }, { wrap: false });

  Tex.screen = canvasTex(256, 168, (g, w, h) => {
    g.fillStyle = '#06161a'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#f2b45a'; g.font = '700 15px monospace'; g.fillText('FRONTIER ONE · DIAG', 12, 24);
    g.fillStyle = 'rgba(108,240,200,0.35)'; g.fillRect(12, 32, w - 24, 1);
    const rows = [['POWER', '98%'], ['COMMS LINK', 'OK'], ['O2 RESERVE', 'NOMINAL'], ['HAB PRESS', '101 kPa'], ['ROVER R-02', 'DOCKED']];
    g.font = '13px monospace';
    rows.forEach(([a, b], i) => { g.fillStyle = '#7fe9cb'; g.fillText(a, 12, 54 + i * 21); g.fillStyle = '#e4eeec'; g.textAlign = 'right'; g.fillText(b, w - 12, 54 + i * 21); g.textAlign = 'left'; });

   ===================================================================== */
const V2 = T.Vector2, V3 = T.Vector3;
function mesh(geo, mat, o = {}) {
  const m = new T.Mesh(geo, mat);
  if (o.p) m.position.set(o.p[0], o.p[1], o.p[2]);
  if (o.r) m.rotation.set(o.r[0], o.r[1], o.r[2]);
  if (o.s) m.scale.set(o.s[0], o.s[1], o.s[2]);

  if (o.parent) o.parent.add(m);
  return m;
}
function roundedBox(w, h, d, r, seg = 3) {
  r = Math.min(r, w / 2 - 0.001, h / 2 - 0.001, d / 2 - 0.001);
  const shape = new T.Shape(), eps = 0.00001, rr = r - eps;
  shape.absarc(eps, eps, eps, -Math.PI / 2, -Math.PI, true);
  shape.absarc(eps, h - rr * 2, eps, Math.PI, Math.PI / 2, true);
  shape.absarc(w - rr * 2, h - rr * 2, eps, Math.PI / 2, 0, true);
  shape.absarc(w - rr * 2, eps, eps, 0, -Math.PI / 2, true);
  const g = new T.ExtrudeGeometry(shape, { depth: Math.max(0.0001, d - r * 2), bevelEnabled: true, bevelSegments: seg * 2, steps: 1, bevelSize: rr, bevelThickness: r, curveSegments: seg });

}
function capsuleGeo(r, len, seg = 8, radial = 16) {

  for (let i = 0; i <= seg; i++) { const a = (i / seg) * Math.PI / 2; pts.push(new V2(Math.max(0, Math.cos(a) * r), Math.sin(a) * r + len / 2)); }
  return new T.LatheGeometry(pts, radial);
}
function rod(a, b, r, mat, parent, radial = 8) {
  const d = new V3().subVectors(b, a), len = d.length();
  const m = new T.Mesh(new T.CylinderGeometry(r, r, len, radial), mat);
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(new V3(0, 1, 0), d.normalize());
  m.castShadow = true; m.receiveShadow = true;

}
/* A text decal bent around a horizontal cylinder whose axis is X (for fuselage sides) */
function curvedDecal(mat, w, h, R, yc) {
  const g = new T.PlaneGeometry(w, h, 24, 6), p = g.attributes.position;
  const thc = Math.asin(clamp(yc / R, -1, 1));
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i), th = thc + y / R; p.setXYZ(i, x, R * Math.sin(th), R * Math.cos(th)); }
  g.computeVertexNormals();
  const m = new T.Mesh(g, mat); m.receiveShadow = true; return m;
}

  if (opts.stairs !== false) {
  const S = SHUTTLE, pt = S.platformTop, xm = (S.stairX0 + S.stairX1) / 2, sw = S.stairX1 - S.stairX0;
  mesh(new T.BoxGeometry(sw + 0.1, 0.12, S.stairZ1 - S.stairZ0 + 0.1), M.grating, { p: [xm, pt - 0.06, (S.stairZ0 + S.stairZ1) / 2], parent: G });
  for (const x of [S.stairX0 + 0.05, S.stairX1 - 0.05]) rod(new V3(x, 0, S.stairZ1 - 0.05), new V3(x, pt - 0.1, S.stairZ1 - 0.05), 0.05, M.grey, G);
  const run = S.stairZ2 - S.stairZ1, ang = Math.atan2(pt, run), slen = Math.hypot(pt, run);
  for (const x of [S.stairX0 + 0.04, S.stairX1 - 0.04]) mesh(new T.BoxGeometry(0.07, 0.24, slen), M.grey, { p: [x, pt / 2, S.stairZ1 + run / 2], r: [ang, 0, 0], parent: G });
  const steps = 8;
  for (let i = 0; i < steps - 1; i++) {
    const z = S.stairZ1 + (i + 1) * run / steps, y = pt * (1 - (i + 1) / steps);
    mesh(new T.BoxGeometry(sw - 0.12, 0.06, 0.42), M.grating, { p: [xm, y - 0.03, z], parent: G });
  }
  for (const x of [S.stairX0, S.stairX1]) {
    const railH = 0.95;
    const path = new T.CurvePath();
    path.add(new T.LineCurve3(new V3(x, pt + railH, S.stairZ0 + 0.05), new V3(x, pt + railH, S.stairZ1)));
    path.add(new T.LineCurve3(new V3(x, pt + railH, S.stairZ1), new V3(x, railH, S.stairZ2)));
    mesh(new T.TubeGeometry(path, 48, 0.035, 8, false), M.orange, { parent: G });
    for (let i = 0; i <= 4; i++) {
      const z = S.stairZ1 + i * run / 4, y = pt * (1 - i / 4);
      rod(new V3(x, y, z), new V3(x, y + railH, z), 0.025, M.grey, G);
    }
    rod(new V3(x, pt, S.stairZ0 + 0.05), new V3(x, pt + railH, S.stairZ0 + 0.05), 0.025, M.grey, G);
    rod(new V3(x, pt + railH * 0.5, S.stairZ0 + 0.05), new V3(x, pt + railH * 0.5, S.stairZ1), 0.018, M.grey, G);
  }
  }
  return G;
}

return { canvasTex, DECAL_FONT, spacedText, Tex, std, decalMat, M, V2, V3, mesh, roundedBox, capsuleGeo, rod, curvedDecal, SHUTTLE, fuselageR, lathePart, buildShuttle };
}

/* =====================================================================

   ===================================================================== */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
const wrapAngle = (a) => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };
const dampAngle = (a, b, lambda, dt) => a + wrapAngle(b - a) * (1 - Math.exp(-lambda * dt));
const col = (hex) => new T.Color(hex).convertSRGBToLinear();
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

let clock = 0, last = performance.now();   // shared game clock (seconds)
const SEED = CONFIG.world.seed;
function hash2(x, y) {
  let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(SEED, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y, oct) { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < oct; i++) { s += noise2(x * f, y * f) * a; n += a; a *= 0.5; f *= 2.03; } return s / n; }
function ridged(x, y) { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < 4; i++) { const r = 1 - Math.abs(noise2(x * f, y * f) * 2 - 1); s += r * r * a; n += a; a *= 0.5; f *= 2.1; } return s / n; }
const noise3 = (x, y, z) => (noise2(x + z * 1.31, y) + noise2(y + x * 0.71, z + 17.3)) * 0.5;

/* =====================================================================
   TERRAIN HEIGHT — shared by terrain mesh, rocks, props, crew and camera
   ===================================================================== */
const Terrain = {
  heightAt(x, z) {
    const W = CONFIG.world;
    const d = Math.hypot(x, z);
    const mask = smoothstep(W.flatRadius, W.flatRadius + W.flatBlend, d);
    const warp = fbm(x * 0.006 + 11, z * 0.006 - 7, 2) * 40;
    const dunes = (fbm((x + warp) * 0.011, (z - warp) * 0.011, 4) - 0.5) * 15;
    const swell = Math.sin((x * 0.8 + z * 0.6) * 0.045 + warp * 0.05) * 1.3;
    const micro = (fbm(x * 0.09, z * 0.09, 2) - 0.5) * 0.45;
    let h = (dunes + swell) * mask + micro * (0.35 + 0.65 * mask);
    const rm = smoothstep(W.ridgeStart, W.ridgeEnd, d);
    if (rm > 0) h += rm * rm * (ridged(x * 0.0065 + 3, z * 0.0065 - 9) * 64 + 6);
    return h;
  },
  normalAt(x, z, out = new T.Vector3()) {
    const e = 0.35;
    const hx = this.heightAt(x + e, z) - this.heightAt(x - e, z);
    const hz = this.heightAt(x, z + e) - this.heightAt(x, z - e);
    return out.set(-hx, 2 * e, -hz).normalize();
  },
  /* Walkable surfaces (shuttle stair + platform) are registered here */
  walkables: [],
  groundAt(x, z) {
    let h = this.heightAt(x, z);
    for (const w of this.walkables) { const v = w(x, z); if (v > h) h = v; }
    return h;
  },
};

function buildRover() {
  const G = new T.Group(); G.name = 'rover';
  const PI = Math.PI;
  const tireGeo = new T.CylinderGeometry(0.48, 0.48, 0.36, 28).rotateX(PI / 2);

  const capGeo = new T.CylinderGeometry(0.09, 0.09, 0.44, 12).rotateX(PI / 2);
  const wheels = [];
  for (const x of [-1.25, 0, 1.25]) for (const z of [-1.08, 1.08]) {
    const w = new T.Group(); w.position.set(x, 0.48, z); G.add(w);
    mesh(tireGeo, [M.tire, M.rubber, M.rubber], { parent: w });
    mesh(hubGeo, M.orange, { parent: w }); mesh(capGeo, M.dark, { parent: w });
    wheels.push(w);
    // suspension arm
    rod(new V3(x, 0.48, z * 0.82), new V3(x * 0.6, 0.86, z * 0.7), 0.05, M.dark, G);
  }
  for (const z of [-0.86, 0.86]) mesh(new T.BoxGeometry(2.9, 0.1, 0.1), M.dark, { p: [0, 0.68, z], parent: G });
  mesh(roundedBox(2.8, 0.55, 1.5, 0.15), M.white, { p: [0, 1.0, 0], parent: G });
  mesh(new T.BoxGeometry(2.62, 0.07, 1.525), M.orange, { p: [0, 1.17, 0], parent: G });
  mesh(new T.BoxGeometry(2.5, 0.06, 1.51), M.dark, { p: [0, 0.8, 0], parent: G });
  mesh(roundedBox(0.25, 0.3, 1.3, 0.06), M.dark, { p: [1.42, 0.95, 0], parent: G });
  for (const z of [-0.45, 0.45]) mesh(new T.BoxGeometry(0.04, 0.09, 0.22), M.headlight, { p: [1.55, 1.02, z], parent: G, cast: false });
  // front solar deck
  mesh(new T.BoxGeometry(1.1, 0.05, 1.3), [M.white, M.white, M.cell, M.dark, M.white, M.white], { p: [0.55, 1.33, 0], r: [0, 0, 0.12], parent: G });
  // rear cargo bed
  mesh(new T.BoxGeometry(1.2, 0.05, 1.32), M.dark, { p: [-0.75, 1.3, 0], parent: G });
  for (const z of [-0.66, 0.66]) mesh(new T.BoxGeometry(1.2, 0.3, 0.05), M.white, { p: [-0.75, 1.45, z], parent: G });
  mesh(new T.BoxGeometry(0.05, 0.3, 1.36), M.white, { p: [-1.35, 1.45, 0], parent: G });
  mesh(new T.BoxGeometry(0.05, 0.22, 1.36), M.orange, { p: [-0.15, 1.41, 0], parent: G });
  mesh(roundedBox(0.5, 0.32, 0.45, 0.05), M.orange, { p: [-0.95, 1.49, 0.25], r: [0, 0.2, 0], parent: G });
  for (let i = 0; i < 3; i++) mesh(new T.CylinderGeometry(0.06, 0.06, 0.32, 12), M.grey, { p: [-0.5, 1.48, -0.38 + i * 0.16], parent: G });
  // mast + camera head
  rod(new V3(1.0, 1.28, -0.45), new V3(1.0, 2.45, -0.45), 0.055, M.grey, G);
  mesh(new T.CylinderGeometry(0.09, 0.09, 0.12, 12), M.orange, { p: [1.0, 1.9, -0.45], parent: G });
  const head = new T.Group(); head.position.set(1.0, 2.55, -0.45); G.add(head);

    mesh(new T.CylinderGeometry(0.055, 0.055, 0.08, 16).rotateZ(PI / 2), M.dark, { p: [0.16, 0.02, z], parent: head });
    mesh(new T.CircleGeometry(0.04, 16).rotateY(PI / 2), M.visor, { p: [0.201, 0.02, z], parent: head, cast: false });
  }
  rod(new V3(-1.2, 1.3, 0.55), new V3(-1.2, 2.3, 0.55), 0.012, M.metal, G);
  mesh(new T.SphereGeometry(0.035, 8, 6), M.orange, { p: [-1.2, 2.32, 0.55], parent: G });

    fragmentShader: `

   ===================================================================== */

    const t = clamp(((pos.x - s.ax) * vx + (pos.z - s.az) * vz) / len2, 0, 1);

function makeRockGeo(detail, seed, flat) {
  const g = new T.IcosahedronGeometry(1, detail), p = g.attributes.position, v = new V3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const n = noise3(v.x * 1.6 + seed, v.y * 1.6, v.z * 1.6) * 0.7 + noise3(v.x * 4 + seed, v.y * 4, v.z * 4) * 0.3;
    v.multiplyScalar(0.68 + n * 0.6); v.y *= flat;
    if (v.y < -0.2) v.y = -0.2 + (v.y + 0.2) * 0.35;
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return g;
}
function scatterRocks() {

  const tiers = [
    { n: CONFIG.rocks.pebbles, geo: makeRockGeo(0, 3, 0.7), s: [0.04, 0.13], near: 0.72, r0: 2, r1: 62, r2: 150, cast: false, sink: 0.25 },
    { n: CONFIG.rocks.small, geo: makeRockGeo(1, 9, 0.65), s: [0.15, 0.42], near: 0.55, r0: 3, r1: 70, r2: 175, cast: false, sink: 0.3 },
    { n: CONFIG.rocks.medium, geo: makeRockGeo(1, 21, 0.62), s: [0.5, 1.3], near: 0.35, r0: 10, r1: 80, r2: 210, cast: true, sink: 0.32 },
    { n: CONFIG.rocks.boulders, geo: makeRockGeo(2, 33, 0.6), s: [1.8, 4.2], near: 0.2, r0: 34, r1: 90, r2: 240, cast: true, sink: 0.35 },
  ];
  const m4 = new T.Matrix4(), q = new T.Quaternion(), e = new T.Euler(), sv = new V3(), pv = new V3(), c = new T.Color();
  const S = SHUTTLE;
  for (const tier of tiers) {

    im.castShadow = tier.cast; im.receiveShadow = true;

    while (placed < tier.n && guard++ < tier.n * 6) {
      const a = R() * Math.PI * 2;

      const x = Math.cos(a) * r, z = Math.sin(a) * r;

      if (R() > cluster * 1.6) continue;
      const s = lerp(tier.s[0], tier.s[1], Math.pow(R(), 2.2));
      if (isBlocked(x, z, s + 0.3)) continue;
      const [lx, lz] = toShuttleLocal(x, z);
      if (lx > S.stairX0 - 0.8 && lx < S.stairX1 + 0.8 && lz > 2 && lz < S.stairZ2 + 3) continue;
      if (Math.hypot(x - L.slab.x, z - L.slab.z) < 2.2) continue;

      e.set(R() * 0.5, R() * Math.PI * 2, R() * 0.5); q.setFromEuler(e);
      sv.set(s * lerp(0.8, 1.25, R()), s * lerp(0.7, 1.05, R()), s * lerp(0.8, 1.25, R()));
