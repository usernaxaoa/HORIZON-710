    this.vel.x = damp(this.vel.x, dx * top, a, dt);
    this.vel.z = damp(this.vel.z, dz * top, a, dt);
    this.pos.x += this.vel.x * dt; this.pos.z += this.vel.z * dt;
    resolveCollisions(this.pos, P.radius);

    const ground = Terrain.groundAt(this.pos.x, this.pos.z);
    if (ctrl && ctrl.jump && this.grounded) { this.vy = P.jump; this.grounded = false; this.jumped = true; }
    if (!this.grounded) {
      this.vy -= P.gravity * dt; this.pos.y += this.vy * dt;
      if (this.pos.y <= ground) { this.land = clamp(-this.vy / 4, 0.2, 1); this.pos.y = ground; this.vy = 0; this.grounded = true; this.onLand = true; }
    } else {
      if (ground < this.pos.y - 0.4) { this.grounded = false; this.vy = 0; }
      else this.pos.y = ground > this.pos.y ? ground : damp(this.pos.y, ground, 30, dt);
    }
    const sp = Math.hypot(this.vel.x, this.vel.z);
    let prevYaw = this.yaw;
    if (sp > 0.25 && (mag > 0.05 || sp > 0.8)) this.yaw = dampAngle(this.yaw, Math.atan2(this.vel.x, this.vel.z), this.grounded ? 11 : 4, dt);
    else if (sp < 0.35 && (this.faceRef || this.hasFace)) {
      const fx = this.faceRef ? this.faceRef.pos.x : this.faceX, fz = this.faceRef ? this.faceRef.pos.z : this.faceZ;
      if (Math.hypot(fx - this.pos.x, fz - this.pos.z) > 0.2) this.yaw = dampAngle(this.yaw, Math.atan2(fx - this.pos.x, fz - this.pos.z), CONFIG.routine.faceTurnRate, dt);
    }
    this.turnRate = damp(this.turnRate, wrapAngle(this.yaw - prevYaw) / Math.max(dt, 1e-4), 10, dt);
    this.speed = sp;
  }

  animate(dt, t, lookAt) {
    const sp = this.speed || 0, P = CONFIG.player;
    const w = damp(this.walk, clamp(sp / P.walk, 0, 1.9), 9, dt); this.walk = w;
    this.air = damp(this.air, this.grounded ? 0 : 1, this.grounded ? 14 : 6, dt);
    this.land = damp(this.land, 0, 6, dt);
    const stride = 1.15 + sp * 0.12;
    const prevPhase = this.phase;
    if (this.grounded) this.phase += (sp / stride) * Math.PI * dt;
    const wl = Math.min(w, 1), run = clamp((w - 1) / 0.8, 0, 1);
    const s = Math.sin(this.phase), c = Math.cos(this.phase);
    const amp = (0.55 + 0.3 * run) * wl;

    // footsteps (heel strike at s = ±1)
    if (this.grounded && sp > 0.4) {
      const k0 = Math.floor((prevPhase + Math.PI / 2) / Math.PI), k1 = Math.floor((this.phase + Math.PI / 2) / Math.PI);
      if (k1 !== k0) this.footstep(k1 % 2 === 0 ? this.legL : this.legR, sp);
    }
    if (this.onLand) { this.onLand = false; this.footstep(this.legL, 2.5, true); this.footstep(this.legR, 2.5, true); }
    if (this.jumped) { this.jumped = false; dust.emit(this.pos, 8, 1.2); }

    const air = this.air;
    const tuckT = -0.55, tuckK = 0.9;
    this.legL.hp.rotation.x = lerp(-s * amp - 0.04 * wl, tuckT, air);
    this.legR.hp.rotation.x = lerp(s * amp - 0.04 * wl, tuckT * 0.4, air);
    const kneeL = Math.max(0, c) * (0.75 + 0.45 * run) * wl + 0.08 * wl;
    const kneeR = Math.max(0, -c) * (0.75 + 0.45 * run) * wl + 0.08 * wl;
    this.legL.kn.rotation.x = lerp(kneeL, tuckK, air) + this.land * 0.5;
    this.legR.kn.rotation.x = lerp(kneeR, tuckK * 0.6, air) + this.land * 0.5;
    this.legL.an.rotation.x = -(this.legL.hp.rotation.x + this.legL.kn.rotation.x) * 0.65;
    this.legR.an.rotation.x = -(this.legR.hp.rotation.x + this.legR.kn.rotation.x) * 0.65;
    this.legL.hp.rotation.z = 0.03; this.legR.hp.rotation.z = -0.03;

    const breathe = Math.sin(t * 1.7 + this.seed) * 0.012;
    const bob = (1 - Math.abs(s)) * (0.05 + 0.1 * run) * wl - 0.03 * wl;
    this.hips.position.y = this.baseHip + bob - this.land * 0.18 + breathe * 0.4;
    this.torso.rotation.x = 0.07 * wl + 0.16 * run + air * -0.1 + this.land * 0.25;
    this.torso.rotation.y = s * 0.09 * wl;
    this.torso.rotation.z = clamp(-this.turnRate * 0.05, -0.18, 0.18) * wl;
    this.torso.position.y = breathe;
    this.hips.rotation.y = -s * 0.05 * wl;

    const armSwing = (0.5 + 0.35 * run) * wl;
    const idleSway = Math.sin(t * 1.3 + this.seed) * 0.04 * (1 - wl);
    this.armL.sh.rotation.x = lerp(s * armSwing + idleSway, -0.6, air);
    this.armR.sh.rotation.x = lerp(-s * armSwing - idleSway, -0.6, air);
    this.armL.sh.rotation.z = lerp(0.14 + breathe * 2, 0.7, air);
    this.armR.sh.rotation.z = lerp(-0.14 - breathe * 2, -0.7, air);
    this.armL.el.rotation.x = -0.25 - 0.45 * wl - 0.3 * run;
    this.armR.el.rotation.x = -0.25 - 0.45 * wl - 0.3 * run;

    // head: idle glances, or look at a target
    /* PHASE 2 · dwell animations: weights blend in/out smoothly, only while (nearly) standing */
    const D = CONFIG.dwell, still = sp < 0.35 && this.grounded;
    for (const k in this.dw) this.dw[k] = damp(this.dw[k], still && this.dwell === k ? 1 : 0, D.blendRate, dt);
    const dw = this.dw;
    let headPitch = -0.05 * wl;
    if (dw.workWithHands > 0.001) {
      const c2 = D.workWithHands, k = dw.workWithHands;
      this.armR.sh.rotation.x = lerp(this.armR.sh.rotation.x, c2.shoulder + Math.sin(t * c2.wiggleSpeed + this.seed) * c2.wiggleAmp * 0.5, k);
      this.armR.sh.rotation.z = lerp(this.armR.sh.rotation.z, -0.05, k);
      this.armR.el.rotation.x = lerp(this.armR.el.rotation.x, c2.elbow + Math.sin(t * c2.wiggleSpeed * 1.3 + 1) * c2.wiggleAmp, k);
      this.armL.sh.rotation.x = lerp(this.armL.sh.rotation.x, -0.25, k * 0.6);
      this.torso.rotation.x += c2.lean * k; headPitch += 0.15 * k;
    }
    if (dw.typeAtConsole > 0.001) {
      const c2 = D.typeAtConsole, k = dw.typeAtConsole;
      for (const [arm, side] of [[this.armL, 1], [this.armR, -1]]) {
        arm.sh.rotation.x = lerp(arm.sh.rotation.x, c2.shoulder, k);
        arm.sh.rotation.z = lerp(arm.sh.rotation.z, -side * c2.inward, k);
        arm.el.rotation.x = lerp(arm.el.rotation.x, c2.elbow + Math.sin(t * c2.tapSpeed + side * 1.7 + this.seed) * c2.tapAmp, k);
      }
      headPitch += c2.headPitch * k;
    }
    if (dw.pickUp > 0.001) {
      const c2 = D.pickUp, k = dw.pickUp, ph = ((t + this.seed * 2) % c2.period) / c2.period, reach = Math.pow(Math.sin(Math.PI * ph), 2) * k;
      this.torso.rotation.x += c2.lean * reach;
      this.armR.sh.rotation.x = lerp(this.armR.sh.rotation.x, c2.reach, reach);
      this.armR.el.rotation.x = lerp(this.armR.el.rotation.x, -0.1, reach);
      this.hips.position.y -= c2.crouch * reach;
      for (const leg of [this.legL, this.legR]) { leg.hp.rotation.x -= c2.knee * 0.55 * reach; leg.kn.rotation.x += c2.knee * reach; }
      headPitch += c2.headPitch * reach;
    }
    if (dw.rest > 0.001) {
      const c2 = D.rest, k = dw.rest;
      this.hips.position.y -= c2.crouch * k;
      for (const leg of [this.legL, this.legR]) { leg.hp.rotation.x = lerp(leg.hp.rotation.x, c2.thigh, k); leg.kn.rotation.x = lerp(leg.kn.rotation.x, c2.knee, k); }
      this.torso.rotation.x += c2.lean * k;
      for (const [arm, side] of [[this.armL, 1], [this.armR, -1]]) { arm.sh.rotation.x = lerp(arm.sh.rotation.x, 0.05, k); arm.sh.rotation.z = lerp(arm.sh.rotation.z, side * 0.07, k); arm.el.rotation.x = lerp(arm.el.rotation.x, -0.15, k); }
      headPitch += (c2.headDown + Math.sin(t * c2.nodSpeed + this.seed) * c2.headNod) * k;
    }
    // keep boots flat after any dwell pose changed the legs
    this.legL.an.rotation.x = -(this.legL.hp.rotation.x + this.legL.kn.rotation.x) * 0.65;
    this.legR.an.rotation.x = -(this.legR.hp.rotation.x + this.legR.kn.rotation.x) * 0.65;

    let targetHead = Math.sin(t * 0.37 + this.seed * 3) * 0.35 * (1 - wl);
    if (dw.lookAround > 0.001) targetHead = lerp(targetHead, Math.sin(t * D.lookAround.speed + this.seed) * D.lookAround.headAmp, dw.lookAround);
    if (lookAt && !this.dwell) {
      const ang = wrapAngle(Math.atan2(lookAt.x - this.pos.x, lookAt.z - this.pos.z) - this.yaw);
      if (Math.abs(ang) < 1.9) targetHead = clamp(ang, -1.0, 1.0);
    }
    this.headYaw = damp(this.headYaw, targetHead, 4, dt);
    this.head.rotation.y = this.headYaw;
    this.head.rotation.x = headPitch;

    this.root.position.copy(this.pos);
    this.root.rotation.y = this.yaw;
  }

  footstep(leg, sp, landing = false) {
    leg.an.getWorldPosition(this.footTmp);
    const gy = Terrain.groundAt(this.footTmp.x, this.footTmp.z);
    this.footTmp.y = gy;
    dust.emit(this.footTmp, landing ? 7 : (sp > 4 ? 5 : 3), landing ? 1.3 : clamp(sp / 4, 0.5, 1.2));
    footprints.add(this.footTmp.x, this.footTmp.z, this.yaw);
  }
}

const crew = CONFIG.crew.map((d, i) => new Astronaut(d, i));
crew.forEach((c, i) => { c.root.userData.astroIndex = i; });
const rand = (a, b) => a + Math.random() * (b - a);
const randRange = (r) => rand(r[0], r[1]);

/* =====================================================================
   PHASE 2 · OBJECT REGISTRY + PLACES (world-space slots built from config)
   ===================================================================== */
const Objects = {
  isInstalled(id) { const o = CONFIG.objects[id]; return !!(o && o.installed); },
  install(id) { if (!CONFIG.objects[id]) CONFIG.objects[id] = { installed: true, layout: id }; else CONFIG.objects[id].installed = true; },
};
function localToWorld(layoutKey, lx, lz, out) {
  const t = CONFIG.layout[layoutKey]; const r = t.rot || 0, c = Math.cos(r), s = Math.sin(r);
  out.x = t.x + lx * c + lz * s; out.z = t.z - lx * s + lz * c; return out;
}
const Places = {};
for (const [id, p] of Object.entries(CONFIG.places)) {
  const layoutKey = CONFIG.objects[p.object].layout;
  const slots = p.slots.map((s) => {
    const a = localToWorld(layoutKey, s.at[0], s.at[1], { x: 0, z: 0 }), f = localToWorld(layoutKey, s.face[0], s.face[1], { x: 0, z: 0 });
    return { x: a.x, z: a.z, fx: f.x, fz: f.z };
  });
  Places[id] = { id, label: p.label, object: p.object, slots, center: localToWorld(layoutKey, 0, 0, { x: 0, z: 0 }) };
}

const NavCapsules = CONFIG.nav.capsules.map((c) => {
  const a = localToWorld(c.layout, c.a[0], c.a[1], { x: 0, z: 0 }), b = localToWorld(c.layout, c.b[0], c.b[1], { x: 0, z: 0 });
  const len = Math.hypot(b.x - a.x, b.z - a.z), ux = (b.x - a.x) / len, uz = (b.z - a.z) / len;
  return { ax: a.x, az: a.z, bx: b.x, bz: b.z, ux, uz, nx: -uz, nz: ux, r: c.r };
});
function segSegDist(p1x, p1z, q1x, q1z, p2x, p2z, q2x, q2z) {
  const d1x = q1x - p1x, d1z = q1z - p1z, d2x = q2x - p2x, d2z = q2z - p2z, rx = p1x - p2x, rz = p1z - p2z;
  const a = d1x * d1x + d1z * d1z, e = d2x * d2x + d2z * d2z, f = d2x * rx + d2z * rz;
  let sN, tN;
  if (a < 1e-9) { sN = 0; tN = clamp(f / e, 0, 1); }
  else {
    const c = d1x * rx + d1z * rz, b = d1x * d2x + d1z * d2z, den = a * e - b * b;
    sN = den > 1e-9 ? clamp((b * f - c * e) / den, 0, 1) : 0;
    tN = (b * sN + f) / e;
    if (tN < 0) { tN = 0; sN = clamp(-c / a, 0, 1); } else if (tN > 1) { tN = 1; sN = clamp((b - c) / a, 0, 1); }
  }
  return Math.hypot(p1x + d1x * sN - (p2x + d2x * tN), p1z + d1z * sN - (p2z + d2z * tN));
}

/* =====================================================================
   PHASE 2 · STORE — one source of truth for crew mode, order, step, slot
   ===================================================================== */
const Store = {
  selected: -1,
  crew: crew.map((a) => ({
    id: a.def.id, index: a.index, name: a.def.name, role: a.def.role, roleKey: a.def.roleKey,
    mode: 'routine', location: 'outside', order: null, step: null, slot: null, status: '',
    wishX: 0, wishZ: 0, wishSpeed: 0,
  })),
  indexOf(id) { for (let i = 0; i < this.crew.length; i++) if (this.crew[i].id === id) return i; return -1; },
  issueOrder(crewId, order) { return Orders.issue(crewId, order); },
  cancelOrder(crewId) { Orders.cancel(crewId); },
  getOrder(crewId) { const i = this.indexOf(crewId); return i < 0 || !this.crew[i].order ? null : Orders.describe(this.crew[i].order); },
  select(i) {
    if (i === this.selected) return;
    const prev = this.selected;
    if (prev >= 0) { const p = this.crew[prev]; p.mode = 'routine'; Routines.start(prev, randRange(CONFIG.routine.resumeDelaySec)); }
    this.selected = i;
    if (i >= 0) {
      const s = this.crew[i]; s.mode = 'player';
      Routines.stop(i); Orders.cancel(s.id); Crowd.release(i);
      const a = crew[i]; a.dwell = null; a.faceRef = null; a.hasFace = false;
      s.status = CONFIG.statusText.player;
      Cam.switchT = 1.2;
    }
    HUD.setActive(i);
  },
};

/* =====================================================================
   PHASE 2 · ORDERS — the only way non-player movement happens
   order input: { target: placeId | crewId | {x,z} | [x,z], onArrive?, face?, speed?, distance?, arriveWhen?, label?, source? }
   ===================================================================== */
const Orders = {
  issue(crewId, input) {
    const i = Store.indexOf(crewId); if (i < 0 || !input) return false;
    const s = Store.crew[i], O = CONFIG.orders;
    const prev = s.order; s.order = null;
    if (prev && prev.onCancel) prev.onCancel(crewId);
    if ((input.source || 'external') === 'external' && s.mode === 'routine') Routines.hold(i);   // routine pauses until this order is done
    const o = { kind: 'position', placeId: null, slot: -1, crewIdx: -1, x: 0, z: 0, fx: 0, fz: 0, hasFace: false, faceIdx: -1,
      distance: input.distance || O.arriveRadius, speed: input.speed || CONFIG.routine.walkSpeed, label: input.label || '',
      onArrive: input.onArrive || null, onFail: input.onFail || null, onCancel: input.onCancel || null, arriveWhen: input.arriveWhen || null,
      source: input.source || 'external', bestDist: Infinity, lastProgress: clock, issuedAt: clock, wps: null, wpi: 0 };
    const t = input.target;
    if (typeof t === 'string' && Places[t]) {
      const pl = Places[t]; o.kind = 'place'; o.placeId = t; o.label = o.label || pl.label;
      let slot = typeof input.slot === 'number' ? input.slot : -1;
      if (slot < 0) slot = Crowd.reserve(t, i, crew[i].pos.x, crew[i].pos.z);
      if (slot >= 0) { const sl = pl.slots[slot]; o.slot = slot; o.x = sl.x; o.z = sl.z; o.fx = sl.fx; o.fz = sl.fz; o.hasFace = true; }
      else { o.x = pl.center.x; o.z = pl.center.z; o.fx = pl.center.x; o.fz = pl.center.z; o.hasFace = true; o.distance = Math.max(o.distance, 3); }
    } else if (typeof t === 'string' && Store.indexOf(t) >= 0) {
      o.kind = 'crew'; o.crewIdx = Store.indexOf(t); o.faceIdx = o.crewIdx; o.distance = input.distance || CONFIG.routine.observeDistance;
      o.label = o.label || Store.crew[o.crewIdx].name.split(' ')[0];
    } else if (t && (Array.isArray(t) || typeof t.x === 'number')) {
      o.x = Array.isArray(t) ? t[0] : t.x; o.z = Array.isArray(t) ? t[1] : t.z;
    } else return false;
    if (input.face) { o.fx = input.face.x; o.fz = input.face.z; o.hasFace = true; }
    s.order = o;
    const a = crew[i]; a.dwell = null; a.faceRef = null; a.hasFace = false;
    return true;
  },
  cancel(crewId) {
    const i = Store.indexOf(crewId); if (i < 0) return;
    const s = Store.crew[i], o = s.order; if (!o) return;
    s.order = null; s.wishX = s.wishZ = 0;
    if (o.onCancel) o.onCancel(crewId);
  },
  describe(o) {
    const where = o.kind === 'place' ? `${o.placeId}${o.slot >= 0 ? ' slot ' + (o.slot + 1) : ''}` : o.kind === 'crew' ? `crew ${Store.crew[o.crewIdx].id}` : `(${o.x.toFixed(1)}, ${o.z.toFixed(1)})`;
    return { kind: o.kind, target: where, label: o.label, source: o.source, ageSec: +(clock - o.issuedAt).toFixed(1) };
  },
  /* steer every crew member that has an order; fills wishX/wishZ/wishSpeed, no allocations */
  update() {
    const O = CONFIG.orders, R = CONFIG.player.radius;
    for (let i = 0; i < Store.crew.length; i++) {
      const s = Store.crew[i], o = s.order; s.wishX = s.wishZ = 0; s.wishSpeed = 0;
      if (!o) continue;
      const a = crew[i];
      let tx = o.x, tz = o.z;
      if (o.kind === 'crew') { const tp = crew[o.crewIdx].pos; tx = tp.x; tz = tp.z; }
      const fdist = Math.hypot(tx - a.pos.x, tz - a.pos.z);
      const arrived = o.arriveWhen ? o.arriveWhen(a.pos.x, a.pos.z) : fdist <= o.distance;
      if (arrived) { this.finish(i, true); continue; }
      // detour around large obstacles via corner waypoints
      if (!o.wps || o.wpi >= o.wps.length) this.planDetour(o, a.pos.x, a.pos.z, tx, tz);
      if (o.wps && o.wpi < o.wps.length) {
        const w = o.wps[o.wpi];
        if (Math.hypot(w.x - a.pos.x, w.z - a.pos.z) < CONFIG.nav.waypointRadius) { o.wpi++; o.bestDist = Infinity; o.lastProgress = clock; }
        if (o.wpi < o.wps.length) { tx = o.wps[o.wpi].x; tz = o.wps[o.wpi].z; }
      }
      const onWaypoint = o.wps && o.wpi < o.wps.length;
      let dx = tx - a.pos.x, dz = tz - a.pos.z; const dist = Math.hypot(dx, dz);
      // progress / stuck detection
      if (dist < o.bestDist - O.stuckMinProgress) { o.bestDist = dist; o.lastProgress = clock; }
      else if (clock - o.lastProgress > O.stuckTimeoutSec) { this.finish(i, false); continue; }
      dx /= dist; dz /= dist;
      // look-ahead avoidance around collider circles
      let sx = dx, sz = dz;
      for (const c of Colliders.circles) {
        const rx = c.x - a.pos.x, rz = c.z - a.pos.z, along = rx * dx + rz * dz;
        if (along <= 0 || along > O.lookAhead || along > dist) continue;
        const px = rx - dx * along, pz = rz - dz * along, pd = Math.hypot(px, pz), clear = c.r + R + O.avoidMargin;
        if (pd >= clear) continue;
        const k = (clear - pd) / clear * O.avoidStrength * (1 - along / (O.lookAhead + 0.01));
        if (pd < 1e-3) { sx += -dz * k; sz += dx * k; } else { sx -= px / pd * k; sz -= pz / pd * k; }
      }
      const sl = Math.hypot(sx, sz) || 1;
      const slow = o.kind === 'crew' || onWaypoint ? 1 : clamp(dist / O.slowRadius, O.minSlowFactor, 1);
      s.wishX = sx / sl; s.wishZ = sz / sl; s.wishSpeed = o.speed * slow;
    }
  },
  planDetour(o, px, pz, tx, tz) {
    o.wps = null; o.wpi = 0;
    const R = CONFIG.player.radius;
    for (const c of NavCapsules) {
      if (segSegDist(px, pz, tx, tz, c.ax, c.az, c.bx, c.bz) >= c.r + R) continue;
      const sp = Math.sign((px - c.ax) * c.nx + (pz - c.az) * c.nz) || 1, st = Math.sign((tx - c.ax) * c.nx + (tz - c.az) * c.nz) || 1;
      if (sp === st) continue;
      const rr = c.r + R + CONFIG.nav.margin;
      let best = null, bestLen = Infinity;
      for (const end of [-1, 1]) {
        const ex = (end < 0 ? c.ax : c.bx) + c.ux * rr * end, ez = (end < 0 ? c.az : c.bz) + c.uz * rr * end;
        const c1x = ex + c.nx * rr * sp, c1z = ez + c.nz * rr * sp, c2x = ex + c.nx * rr * st, c2z = ez + c.nz * rr * st;
        const len = Math.hypot(c1x - px, c1z - pz) + Math.hypot(c2x - c1x, c2z - c1z) + Math.hypot(tx - c2x, tz - c2z);
        if (len < bestLen) { bestLen = len; best = [{ x: c1x, z: c1z }, { x: c2x, z: c2z }]; }
      }
      o.wps = best; return;
    }
  },
  finish(i, ok) {
    const s = Store.crew[i], o = s.order, a = crew[i];
    s.order = null; s.wishX = s.wishZ = 0;
    if (ok) {
      if (o.faceIdx >= 0) { a.faceRef = crew[o.faceIdx]; a.hasFace = false; }
      else if (o.hasFace) { a.faceX = o.fx; a.faceZ = o.fz; a.hasFace = true; a.faceRef = null; }
      if (o.onArrive) o.onArrive(s.id);
    } else {
      if (o.slot >= 0) Crowd.release(i);
      if (o.onFail) o.onFail(s.id);
    }
  },
};

/* =====================================================================
   PHASE 2 · CROWD — reserved standing slots + soft separation
   ===================================================================== */
const Crowd = {
  occ: {},
  init() { for (const id in Places) this.occ[id] = Places[id].slots.map(() => -1); },
  reserve(placeId, i, px, pz) {
    this.release(i);
    const occ = this.occ[placeId]; if (!occ) return -1;
    let best = -1, bestD = Infinity;
    occ.forEach((o, k) => { if (o >= 0) return; const sl = Places[placeId].slots[k], d = Math.hypot(sl.x - px, sl.z - pz); if (d < bestD) { bestD = d; best = k; } });
    if (best >= 0) { occ[best] = i; Store.crew[i].slot = { placeId, index: best }; }
    return best;
  },
  release(i) {
    const s = Store.crew[i]; if (!s.slot) return;
    const occ = this.occ[s.slot.placeId]; if (occ && occ[s.slot.index] === i) occ[s.slot.index] = -1;
    s.slot = null;
  },
  hasFree(placeId) { const occ = this.occ[placeId]; return !!occ && occ.some((o) => o < 0); },
  separate(dt) {
    const C = CONFIG.crowd, sel = Store.selected, n = crew.length;
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const a = crew[i].pos, b = crew[j].pos;
      if (Math.abs(a.y - b.y) > 1.5) continue;
      let dx = b.x - a.x, dz = b.z - a.z; let d = Math.hypot(dx, dz);
      if (d >= C.threshold) continue;
      if (d < 1e-4) { dx = 1; dz = 0; d = 1e-4; }
      const overlap = C.threshold - d;
      const hard = Math.max(0, C.radius * 2 - d);           // never allow bodies to interpenetrate
      const amt = Math.min(overlap * C.push * dt, C.maxStep) + hard;
      const wa = i === sel ? 0 : j === sel ? 1 : 0.5, wb = j === sel ? 0 : i === sel ? 1 : 0.5;
      const nx = dx / d, nz = dz / d;
      a.x -= nx * amt * wa; a.z -= nz * amt * wa; b.x += nx * amt * wb; b.z += nz * amt * wb;
      if (wa) resolveCollisions(a, CONFIG.player.radius);
      if (wb) resolveCollisions(b, CONFIG.player.radius);
    }
  },
};
Crowd.init();

/* =====================================================================
   PHASE 2 · ROUTINES — data-driven loop: pick step → walk → dwell → maybe rest → repeat
   ===================================================================== */
const Routines = {
  st: crew.map(() => ({ phase: 'off', until: 0, prev: -1, step: null, label: '' })),
  start(i, delay) { const r = this.st[i]; r.phase = 'wait'; r.until = clock + delay; Store.crew[i].step = null; Store.crew[i].status = CONFIG.statusText.standby; },
  stop(i) { const r = this.st[i]; r.phase = 'off'; r.step = null; Store.crew[i].step = null; },
  hold(i) { const r = this.st[i]; Crowd.release(i); r.phase = 'held'; r.step = null; Store.crew[i].step = null; Store.crew[i].status = CONFIG.statusText.external; },
  available(i) {
    const steps = CONFIG.routines[Store.crew[i].roleKey] || [];
    const out = [];
    steps.forEach((st, k) => {
      if (st.requires && !Objects.isInstalled(st.requires)) return;
      if (Places[st.place] && !Objects.isInstalled(Places[st.place].object)) return;
      out.push(k);
    });
    return out;
  },
  pickIndex(i, exclude) {
    const steps = CONFIG.routines[Store.crew[i].roleKey];
    let cands = this.available(i).filter((k) => !exclude.includes(k));
    if (cands.length > 1) cands = cands.filter((k) => k !== this.st[i].prev).length ? cands.filter((k) => k !== this.st[i].prev) : cands;
    if (!cands.length) return -1;
    let total = 0; cands.forEach((k) => { total += steps[k].weight || 1; });
    let r = Math.random() * total;
    for (const k of cands) { r -= steps[k].weight || 1; if (r <= 0) return k; }
    return cands[cands.length - 1];
  },
  roamPoint(i) {
    const R = CONFIG.routine;
    for (let tries = 0; tries < 24; tries++) {
      const ang = Math.random() * Math.PI * 2, rr = rand(R.roamRing[0], R.roamRing[1]);
      const x = Math.cos(ang) * rr, z = Math.sin(ang) * rr;
      if (isBlocked(x, z, R.roamClearance)) continue;
      if (1 - Terrain.normalAt(x, z, tmpN).y > R.roamMaxSlope) continue;
      if (Terrain.groundAt(x, z) > Terrain.heightAt(x, z) + 0.05) continue;
      return { x, z };
    }
    return null;
  },
  pick(i) {
    const steps = CONFIG.routines[Store.crew[i].roleKey], T = CONFIG.statusText, R = CONFIG.routine, r = this.st[i];
    const tried = [];
    for (let attempt = 0; attempt < R.maxPickTries; attempt++) {
      const k = this.pickIndex(i, tried); if (k < 0) break; tried.push(k);
      const step = steps[k];
      const common = { source: 'routine', onArrive: () => this.arrive(i), onFail: () => this.failed(i), onCancel: () => { if (r.phase === 'walk') this.start(i, randRange(R.nextTaskDelaySec)); } };
      let ok = false;
      if (step.place === 'observeCrew') {
        const others = crew.map((_, j) => j).filter((j) => j !== i);
        const j = others[(Math.random() * others.length) | 0];
        Crowd.release(i);
        ok = Orders.issue(Store.crew[i].id, Object.assign({ target: Store.crew[j].id, distance: R.observeDistance }, common));
        r.label = Store.crew[j].name.split(' ')[0];
      } else if (step.place === 'roam') {
        const p = this.roamPoint(i); if (!p) continue;
        Crowd.release(i);
        ok = Orders.issue(Store.crew[i].id, Object.assign({ target: p }, common));
        r.label = '';
      } else {
        if (!Places[step.place] || !Crowd.hasFree(step.place)) continue;
        ok = Orders.issue(Store.crew[i].id, Object.assign({ target: step.place }, common));
        r.label = Places[step.place].label;
      }
      if (!ok) continue;
      r.phase = 'walk'; r.step = step; r.prev = k;
      Store.crew[i].step = `${step.place} · ${step.anim}`;
      Store.crew[i].status = step.place === 'roam' ? T.roamWalk : `${T.walking} ${r.label}`;
      return;
    }
    r.phase = 'wait'; r.until = clock + randRange(R.slotRetrySec); Store.crew[i].status = T.waiting;
  },
  arrive(i) {
    const r = this.st[i], T = CONFIG.statusText; if (r.phase !== 'walk' || !r.step) return;
    r.phase = 'dwell'; r.until = clock + randRange(r.step.waitSec);
    crew[i].dwell = r.step.anim;
    Store.crew[i].status = r.step.place === 'observeCrew' ? `${T.observe} ${r.label}` : r.step.place === 'roam' ? T.roam : `${T.verbs[r.step.anim]} ${r.label}`;
  },
  failed(i) { const r = this.st[i]; if (r.phase !== 'walk') return; Crowd.release(i); this.start(i, randRange(CONFIG.routine.nextTaskDelaySec)); },
  externalDone(i) { if (this.st[i].phase === 'held' && Store.crew[i].mode === 'routine') this.start(i, randRange(CONFIG.routine.afterExternalWaitSec)); },
  update() {
    const R = CONFIG.routine;
    for (let i = 0; i < crew.length; i++) {
      const s = Store.crew[i], r = this.st[i];
      if (s.mode !== 'routine') continue;
      if (r.phase === 'held' && !s.order) { this.externalDone(i); continue; }
      if (clock < r.until) continue;
      if (r.phase === 'wait') this.pick(i);
      else if (r.phase === 'dwell') {
        crew[i].dwell = null; crew[i].faceRef = r.step && r.step.place === 'observeCrew' ? null : crew[i].faceRef;
        if (Math.random() < R.restAfterTask.chance) { r.phase = 'rest'; r.until = clock + randRange(R.restAfterTask.waitSec); crew[i].dwell = 'rest'; s.status = CONFIG.statusText.resting; }
        else { Crowd.release(i); this.start(i, randRange(R.nextTaskDelaySec)); }
      } else if (r.phase === 'rest') { crew[i].dwell = null; Crowd.release(i); this.start(i, randRange(R.nextTaskDelaySec)); }
    }
  },
};
const tmpN = new V3();
crew.forEach((c, i) => Routines.start(i, randRange(CONFIG.routine.startDelaySec)));

/* =====================================================================
   INPUT — keyboard, mouse drag look, wheel zoom, touch joystick
   ===================================================================== */
const Input = {
  keys: new Set(), jumpQueued: false, joy: { x: 0, y: 0, id: null, ox: 0, oy: 0 }, look: { id: null, x: 0, y: 0 },
  dx: 0, dy: 0, zoom: 0, lastLook: -99, _mv: { x: 0, z: 0 },
  move() {
    const k = this.keys;
    let x = (k.has('KeyD') || k.has('ArrowRight') ? 1 : 0) - (k.has('KeyA') || k.has('ArrowLeft') ? 1 : 0);
    let z = (k.has('KeyW') || k.has('ArrowUp') ? 1 : 0) - (k.has('KeyS') || k.has('ArrowDown') ? 1 : 0);
    x += this.joy.x; z += this.joy.y;

  },
  get run() { return this.keys.has('ShiftLeft') || this.keys.has('ShiftRight') || Math.hypot(this.joy.x, this.joy.y) > 0.92; },
};
addEventListener('keydown', (e) => {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const onScene = e.target === canvas || e.target === document.body;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code) || (e.code === 'Tab' && onScene)) e.preventDefault();
  if (e.code === 'Space' && !e.repeat) Input.jumpQueued = true;
  if (/^Digit[1-4]$/.test(e.code)) selectCrew(+e.code.slice(5) - 1);
  if (e.code === 'Escape' && !document.pointerLockElement) selectCrew(-1);
  if (e.code === 'Backquote' && !e.repeat) Debug.toggle();
  if (e.code === 'Tab' && !e.repeat && (e.target === canvas || e.target === document.body)) selectCrew(Store.selected < 0 ? 0 : (Store.selected + (e.shiftKey ? 3 : 1)) % 4);
  if (e.code === 'KeyH' && !e.repeat && window.toggleHint) window.toggleHint();
  if (e.code === 'KeyF' && !e.repeat) { const f = document.getElementById('fps'); f.hidden = !f.hidden; }
  Input.keys.add(e.code);
});
addEventListener('keyup', (e) => Input.keys.delete(e.code));
addEventListener('blur', () => Input.keys.clear());

const joyEl = document.getElementById('joy'), knob = document.getElementById('joyKnob');
canvas.addEventListener('pointerdown', (e) => {
  canvas.focus({ preventScroll: true });
  if (document.pointerLockElement === canvas) return;
  if (e.pointerType === 'touch') document.documentElement.classList.add('touch');
  const touchJoy = e.pointerType === 'touch' && e.clientX < innerWidth * 0.45 && e.clientY > innerHeight * 0.35;
  if (touchJoy && Input.joy.id === null) {
    Input.joy.id = e.pointerId; Input.joy.ox = e.clientX; Input.joy.oy = e.clientY;
    joyEl.style.left = e.clientX + 'px'; joyEl.style.top = e.clientY + 'px'; joyEl.classList.add('on'); knob.style.transform = '';
  } else if (Input.look.id === null) {
    Input.look.id = e.pointerId; Input.look.x = e.clientX; Input.look.y = e.clientY; canvas.classList.add('dragging');
    Input.look.sx = e.clientX; Input.look.sy = e.clientY; Input.look.t = performance.now();
  }
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerId === Input.joy.id) {
    let dx = e.clientX - Input.joy.ox, dy = e.clientY - Input.joy.oy; const r = 50, d = Math.hypot(dx, dy);
    if (d > r) { dx *= r / d; dy *= r / d; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    Input.joy.x = dx / r; Input.joy.y = -dy / r;
  } else if (e.pointerId === Input.look.id) {
    Input.dx += e.clientX - Input.look.x; Input.dy += e.clientY - Input.look.y;
    Input.look.x = e.clientX; Input.look.y = e.clientY; Input.lastLook = clock;
  }
});
const endPointer = (e) => {
  if (e.pointerId === Input.joy.id) { Input.joy.id = null; Input.joy.x = Input.joy.y = 0; joyEl.classList.remove('on'); }
  if (e.pointerId === Input.look.id) {
    Input.look.id = null; canvas.classList.remove('dragging');
    if (e.type === 'pointerup' && Math.hypot(e.clientX - Input.look.sx, e.clientY - Input.look.sy) < 6 && performance.now() - Input.look.t < 400) pickAt(e.clientX, e.clientY);
  }
};
canvas.addEventListener('pointerup', endPointer);
const picker = new T.Raycaster(), pickNdc = new T.Vector2();
function pickAt(cx, cy) {
  pickNdc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
  picker.setFromCamera(pickNdc, camera);
  const hits = picker.intersectObjects([...crew.filter((c) => c.root.visible).map((c) => c.root), ...pickables.filter((o) => o.visible)], true);
  if (!hits.length) return;
  let o = hits[0].object;
  while (o && o.userData.astroIndex === undefined && o.parent) o = o.parent;
  if (o && o.userData.astroIndex !== undefined) { selectCrew(o.userData.astroIndex); return; }
  /* an object of interest (solar panel, rover, antenna, terminal, greenhouse) → the current Sol decides what happens */
  let q = hits[0].object; while (q && !q.userData.interactId && q.parent) q = q.parent;
  if (q && q.userData.interactId && Sol.onObjectClick(q.userData.interactId)) return;
  if (hits[0].object.userData.ground) selectCrew(-1);   // empty ground releases control
}
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', (e) => { e.preventDefault(); Input.zoom += Math.sign(e.deltaY) * Math.min(Math.abs(e.deltaY), 120) / 120; }, { passive: false });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
{
  const jb = document.getElementById('btnJump');
  jb.addEventListener('pointerdown', (e) => { e.preventDefault(); Input.jumpQueued = true; });
}
if (isCoarse) document.documentElement.classList.add('touch');

/* =====================================================================
   CAMERA RIG — orbit follow with smoothing, terrain-aware
   ===================================================================== */
const tmpSun = new V3();
const Cam = {
  yaw: CONFIG.camera.yaw, pitch: CONFIG.camera.pitch, dist: CONFIG.camera.dist, distT: CONFIG.camera.dist,
  focus: new V3(), follow: 9, switchT: 0, pitchGoal: null, faceYaw: 0, faceT: 0, shake: 0, lookAt: null, look: new V3(),
  face(p) { const a = Store.selected >= 0 ? crew[Store.selected].pos : this.focus; this.faceYaw = Math.atan2(-(p.x - a.x), -(p.z - a.z)); this.faceT = 1.4; this.pitchGoal = Math.max(this.pitch, 0.22); Input.lastLook = clock; },
  init(p) { this.focus.set(p.x, p.y + CONFIG.camera.height, p.z); },
  update(dt, a) {
    const C = CONFIG.camera;
    if (Input.dx || Input.dy) { this.faceT = 0; this.pitchGoal = null; }
    this.yaw -= Input.dx * 0.0052; this.pitch = clamp(this.pitch + Input.dy * 0.004, C.minPitch, C.maxPitch);
    if (this.faceT > 0) { this.faceT -= dt; this.yaw = dampAngle(this.yaw, this.faceYaw, 5, dt); }
    if (this.pitchGoal !== null) { this.pitch = damp(this.pitch, this.pitchGoal, 5, dt); if (Math.abs(this.pitch - this.pitchGoal) < 0.005) this.pitchGoal = null; }
    Input.dx = Input.dy = 0;
    if (Input.zoom) { this.distT = clamp(this.distT * Math.pow(1.12, Input.zoom), C.min, C.max); Input.zoom = 0; }
    this.dist = damp(this.dist, this.distT, 8, dt);
    // gentle auto-follow behind the walker when they move and the player isn't steering the camera
    this.switchT = Math.max(0, this.switchT - dt);
    if (a) {   // nobody selected: the camera keeps its last focus and can still orbit
      const mv = Input.move();
      if (a.speed > 1 && clock - Input.lastLook > 2.2 && mv.z > 0.2) this.yaw = dampAngle(this.yaw, a.yaw + Math.PI, 0.7, dt);
      const lam = this.switchT > 0 ? 3.2 : this.follow;
      const tx = a.pos.x, ty = a.pos.y + C.height, tz = a.pos.z;
      this.focus.x = damp(this.focus.x, tx, lam, dt); this.focus.z = damp(this.focus.z, tz, lam, dt);
      this.focus.y = damp(this.focus.y, ty, a.grounded ? lam * 0.8 : 2.5, dt);
    }
    const cp = Math.cos(this.pitch), d = this.dist;
    camera.position.set(this.focus.x + Math.sin(this.yaw) * cp * d, this.focus.y + Math.sin(this.pitch) * d, this.focus.z + Math.cos(this.yaw) * cp * d);
    const minY = Terrain.heightAt(camera.position.x, camera.position.z) + 0.6;
    if (camera.position.y < minY) camera.position.y = minY;
    if (this.shake > 0.0005) camera.position.add(this.look.set(Math.sin(clock * 47) * this.shake, Math.sin(clock * 53 + 1) * this.shake * 0.6, Math.cos(clock * 41) * this.shake));
    this.look.set(this.focus.x, this.focus.y + 0.15, this.focus.z);
    if (this.lookAt) {   // scripted look (e.g. up at the sun during the solar spike)
      this.lookAt.k = Math.min(1, this.lookAt.k + dt * 0.7); const k = this.lookAt.k * this.lookAt.k * (3 - 2 * this.lookAt.k);
      this.look.lerp(tmpSun.copy(camera.position).addScaledVector(SUN_DIR, 200), k);
    }
    camera.lookAt(this.look);
    sky.position.copy(camera.position);
  },
};

    const a = alpha * (1 - smoothstep(30, 58, d)) * smoothstep(barB, barB + 26, (-v.y * 0.5 + 0.5) * innerHeight - l.h);
    const sc = clamp(16 / d, 0.78, 1);
    const x = (v.x * 0.5 + 0.5) * innerWidth - l.w / 2, y = (-v.y * 0.5 + 0.5) * innerHeight - l.h;
    l.el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${sc.toFixed(3)})`;

  },
  update(dt) {

    this.crewLabels.forEach((l) => {

      l.anchor.set(c.pos.x, c.pos.y + 2.3, c.pos.z);

    });
    this.frames++; this.fpsAcc += dt; this.acc += dt;
    if (this.acc < 0.15) return;
    const heading = ((-Cam.yaw * 180 / Math.PI) % 360 + 360) % 360;
    const card = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(heading / 45) % 8];
    this.el.hdg.textContent = `${String(Math.round(heading) % 360).padStart(3, '0')}° ${card}`;
    const mins = 9 * 60 + 41 + clock / 60;
    this.el.time.textContent = `${String(Math.floor(mins / 60) % 24).padStart(2, '0')}:${String(Math.floor(mins % 60)).padStart(2, '0')}`;
    this.el.temp.textContent = `−${(58 - clock / 240).toFixed(0)}°C`;

    if (a) crew.forEach((c) => { if (c === a) return; const d = Math.hypot(c.pos.x - a.pos.x, c.pos.z - a.pos.z) - CONFIG.player.radius * 2; if (d < mateD) { mateD = d; mate = c; } });
    let key = '', eyebrow = '', title = '', text = '';
    if (mate) { key = 'crew' + mate.index; eyebrow = `Crew contact · ${Math.max(0, mateD).toFixed(1)} m`; title = `${mate.def.name} · ${mate.def.role}`; text = mate.def.bio; }
    else if (best) { key = best.name; eyebrow = `${best.kind} · ${bestDist.toFixed(1)} m`; title = best.name; text = best.info; }
    if (key) {
      this.el.nearEyebrow.textContent = eyebrow;
      if (key !== this.nearKey) { this.el.nearTitle.textContent = title; this.el.nearText.textContent = text; }

const quality = { t: 0, frames: 0, level: 0 };
function adaptQuality(dt) {
  quality.t += dt; quality.frames++;
  if (quality.t < 3) return;
  const fps = quality.frames / quality.t; quality.t = 0; quality.frames = 0;
  if (fps < 48 && quality.level < 3) {
    quality.level++;
    if (pixelRatio > 1) { pixelRatio = Math.max(1, pixelRatio - 0.35); renderer.setPixelRatio(pixelRatio); onResize(); }
    else if (sun.shadow.mapSize.x > 1024) { sun.shadow.mapSize.set(1024, 1024); sun.shadow.map && sun.shadow.map.dispose(); sun.shadow.map = null; }
  }
}
function onResize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  dust.points.material.uniforms.uScale.value = innerHeight * pixelRatio;
  ambientDust.points.material.uniforms.uScale.value = innerHeight * pixelRatio;
}

const StormFX = (() => {
  const S = SOL_CONFIG.storm, base = { near: scene.fog.near, far: scene.fog.far, color: scene.fog.color.clone(), sun: sun.intensity, hemi: hemi.intensity };
  const stormCol = col(S.color);
  const dome = new T.Mesh(new T.SphereGeometry(700, 32, 16), new T.MeshBasicMaterial({ color: stormCol, side: T.BackSide, transparent: true, opacity: 0, depthWrite: false, fog: false }));
  dome.renderOrder = -9; dome.frustumCulled = false; scene.add(dome);
  const n = S.dustCount, pos = new Float32Array(n * 3), alpha = new Float32Array(n), size = new Float32Array(n), R = rng(17), box = 26;
  for (let i = 0; i < n; i++) { pos[i * 3] = (R() - 0.5) * box * 2; pos[i * 3 + 1] = R() * 9; pos[i * 3 + 2] = (R() - 0.5) * box * 2; alpha[i] = 0.35 + R() * 0.65; size[i] = 0.1 + R() * 0.28; }

    update(dt, focus) {

      const k = level;
      scene.fog.near = lerp(base.near, S.fogNear, k); scene.fog.far = lerp(base.far, S.fogFar, Math.pow(k, 0.6));
      scene.fog.color.copy(base.color).lerp(stormCol, Math.min(1, k * 1.2));

      dome.material.opacity = Math.min(0.94, k * 1.05); dome.visible = k > 0.001; dome.position.copy(camera.position);
      pts.visible = k > 0.001; pts.material.uniforms.uOpacity.value = k * 0.9;

          const gh = Terrain.heightAt(x, z); if (y < gh) y = gh + 8; if (y > gh + 9) y = gh + 0.2;

/* ---------- economy (gameState.outpost is the store) ---------- */
const Econ = {
  spend({ power = 0, lifeSupport = 0 }) { const o = OUT(); o.power = Math.max(0, o.power - power); o.lifeSupport = Math.max(0, o.lifeSupport - lifeSupport); },
  gain({ power = 0, lifeSupport = 0 }) { const o = OUT(); o.power = Math.min(o.powerMax, o.power + power); o.lifeSupport += lifeSupport; },
  health(delta) { const o = OUT(); for (const k in o.health) o.health[k] = Math.max(0, Math.min(100, o.health[k] + delta)); },
  batteryOutput(sol) { const opt = (svc.powerOptions || []).find((p) => p.id === gameState.resources.power); return opt ? (sol >= 4 ? opt.sol4Output : opt.output) : 3; },
};

/* ---------- scheduler on the game clock + cancellable runs ---------- */
const Sched = {
  tasks: [],
  add(sec, fn) { const t = { at: Sol.clock + sec, fn, alive: true }; this.tasks.push(t); return t; },
  update() { if (!this.tasks.length) return; const now = Sol.clock, due = this.tasks.filter((t) => t.alive && now >= t.at); this.tasks = this.tasks.filter((t) => t.alive && now < t.at); due.forEach((t) => t.fn()); },
  clear() { this.tasks.forEach((t) => { t.alive = false; }); this.tasks = []; },
};
const Sol = {
  n: 1, run: null, decision: null, active: false,
  clock: 0, speed: 1,   // Sol timers run on their own clock; speed > 1 is for automated tests only (RedFrontier.sol.speed)
  newRun() { if (this.run) this.run.alive = false; const run = { alive: true }; this.run = run; return run; },
  guard(run, p) { return p.then((v) => { if (!run.alive) throw SOL_CANCEL; return v; }); },
  wait(run, sec) { return this.guard(run, new Promise((res) => Sched.add(sec, res))); },
  modal(run, o) { return this.guard(run, SolUI.modal(o)); },
  warning(run, o) { return this.guard(run, SolUI.warning(o)); },
  /* a timed decision: handler(id, role, d) returns a result to finish early; on timeout resolves 'timeout' */
  decide(run, secs, handler, label, ids) {
    return this.guard(run, new Promise((resolve) => {
      const d = { left: secs, handler, ids, finish: (v) => { if (this.decision !== d) return; this.decision = null; SolUI.timer(null); resolve(v); }, data: {} };
      if (label) SolUI.objective(label);
      this.decision = d; SolUI.timer(secs);
    }));
  },
  onObjectClick(id) {

  async newDay(run, n) {
    await this.guard(run, svc.white(1, SOL_CONFIG.white.inMs));
    SolUI.closeAll(); Arrows.clear(); SolUI.alarm(false); SolUI.glitch(0);

  setSol(n) { this.n = n; OUT().sol = n; const el = document.getElementById('tSol'); if (el) el.textContent = String(n).padStart(3, '0'); },
  /* start-of-day bookkeeping for Sol 2–4; returns extra lines for the morning message */

    o.lifeSupport = Math.max(0, o.lifeSupport - D.lifeSupport);

    if (n >= 4 && o.needPanelClean) lines.push(T2.noSolar);
    if (n >= 4 && gameState.resources.power === 'battery') lines.push(T2.cold);

  async start(fromSol) {

  },
  async devPrepare(n) {   // #dev=solN: fill in yesterday's choices with sensible defaults

  },

  /* ---------------- SOL 1: tutorial + dusty solar panel ---------------- */
  async sol1(run) {

  /* ---------------- SOL 2: food + greenhouse ---------------- */
  async sol2(run) {

    const lines = this.morning(2);
    await this.modal(run, { kind: 'info', kicker: 'Sol 2', text: tx(X.morning, { n: 2 }), lines });

  },

  /* ---------------- SOL 3: global dust storm ---------------- */
  async sol3(run) {
    const C = SOL_CONFIG.sol3, X = SOL_TEXT, o = OUT();
    await this.wait(run, C.morningAt);
    const lines = this.morning(3);
    await this.modal(run, { kind: 'info', kicker: 'Sol 3', text: tx(X.morning, { n: 3 }), lines });
    await this.wait(run, C.warnAt);
    await this.modal(run, { kind: 'alert', text: X.weatherWarn });

  /* ---------------- SOL 4: solar flare + ending ---------------- */
  async sol4(run) {

    await this.modal(run, { kind: 'danger', kicker: X.donkiKicker, text: X.donki });
    SolUI.glitch(1); Arrows.show('terminal');

const CONFIG_SOLAR_UNITS = (svc.solarUnits !== undefined ? svc.solarUnits : 2);

HUD.init();
Cam.init(crew[0].pos);
for (let i = 0; i < 60; i++) Cam.update(1 / 30, crew[0]);

  if (sel >= 0 && moving && Store.crew[sel].order) Orders.cancel(Store.crew[sel].id);   // manual input cancels auto-walk

  Orders.update();            // steering for every crew member that has an order

    if (isPlayer && !sc.order) {
      let mx = mv.x, mz = mv.z; const mag = Math.hypot(mx, mz); if (mag > 1) { mx /= mag; mz /= mag; }
      const sy = Math.sin(Cam.yaw), cy = Math.cos(Cam.yaw);

  for (let i = 0; i < crew.length; i++) { const c = crew[i]; c.animate(dt, clock, leader && i !== sel && c.pos.distanceTo(leader.pos) < 12 ? tmpLook : null); }

  Cam.update(dt, leader);
  const focus = leader ? leader.pos : Cam.focus;
  updateShadowFocus(focus);

  const bu = antenna.userData, pulse = (clock % 1.6) < 0.18 ? 1 : 0;
  bu.beacon.material.emissiveIntensity = 0.4 + pulse * 3.2;
  bu.glow.material.opacity = 0.15 + pulse * 0.85;
  rover.userData.head.rotation.y = Math.sin(clock * 0.35) * 0.9;

    ring.position.set(leader.pos.x, leader.pos.y + 0.03, leader.pos.z);
    const rp = 1 + Math.sin(clock * 4) * 0.04; ring.scale.set(rp, 1, rp);
    ring.userData.r1.material.opacity = 0.55 + Math.sin(clock * 4) * 0.2;

  ambientDust.update(dt, clock, focus);
  HUD.update(dt);

  if (running) rafId = requestAnimationFrame(frame);
}
rafId = requestAnimationFrame((t) => { last = t; rafId = requestAnimationFrame(frame); veilTimer = setTimeout(() => document.getElementById('veil').classList.add('gone'), 60); toast('Frontier One · Sol 001', 'HORIZON 710', 'The crew is at work. Pick someone to take control'); });
{ const devSol = gameState.devSol || 1; delete gameState.devSol; Sol.start(devSol); }

/* Public hooks for later phases */

  setSolarDust(v) { M.cell.userData.uDust.value = clamp(v, 0, 1); },
  selectCrew, get crew() { return crew; }, get camera() { return camera; }, config: CONFIG, Terrain,
  /* Phase 2 order API, e.g. RedFrontier.issueOrder('kai', { target: 'antenna' }) or { target: 'mira' } or { target: { x: 5, z: 9 } } */
  store: Store,

  cancelOrder: (id) => Store.cancelOrder(id),
  getOrder: (id) => Store.getOrder(id),
  installObject: (id) => Objects.install(id),
  debug: (on) => Debug.toggle(on),
  sol: Sol,

function disposeGame() {
  if (!running) return;
  running = false;
  cancelAnimationFrame(rafId); clearTimeout(veilTimer); clearTimeout(toastTimer);
  Sol.stop(); SolUI.dispose(); Arrows.dispose(); StormFX.dispose(); gameRoot.classList.remove('sol-glitch', 'strong');
  for (const [target, type, fn, opt] of _listeners) target.removeEventListener(type, fn, opt);

}

(() => {

/* ScreenBackground + shared look. A redesign of the menu screens only touches this object. */

    html += `<span class="dg-star" style="left:${(R() * 100).toFixed(2)}%;top:${(R() * 100).toFixed(2)}%;width:${s.toFixed(1)}px;height:${s.toFixed(1)}px;--o:${range(S.opacity).toFixed(2)};--d:${range(S.twinkleSec).toFixed(1)}s;--delay:-${(R() * 6).toFixed(1)}s"></span>`;

    html += `<span class="dg-sparkle" style="left:${(4 + R() * 92).toFixed(2)}%;top:${(4 + R() * 92).toFixed(2)}%;--s:${range(S.sparklePx).toFixed(0)}px;--o:${(0.25 + R() * 0.45).toFixed(2)};--d:${range(S.twinkleSec).toFixed(1)}s;--delay:-${(R() * 6).toFixed(1)}s">${SPARKLE_SVG}</span>`;

  Object.entries(R.colors).forEach(([k, c]) => { bars[k].style.background = c; });
  const costOf = (group) => { const o = R[group].options.find((x) => x.id === res[group]); return o ? o.cost : 0; };
  const lifeCost = () => (res.lifeSupport ?? 0) * Ls.cargoPerUnit;
  const lifeLimit = () => Math.max(Ls.min, Math.floor((R.cargoMax - costOf('radiationShield') - costOf('power')) / Ls.cargoPerUnit / Ls.step) * Ls.step);
  let noteTimer = 0;
  const say = (msg) => { note.textContent = msg; clearTimeout(noteTimer); noteTimer = setTimeout(() => { note.textContent = ''; }, 4000); };
  const render = () => {

    cargoValue.textContent = t('cargoValue', { used, max: R.cargoMax });
    bars.lifeSupport.style.width = (lifeCost() / R.cargoMax * 100) + '%';
    bars.radiationShield.style.width = (costOf('radiationShield') / R.cargoMax * 100) + '%';
    bars.power.style.width = (costOf('power') / R.cargoMax * 100) + '%';

/* ---------------------------------------------------------------- stage: GAME (the existing 3D game) */
function mountGame(host) {
  /* The 3D game puts its own DOM in #game-root. Its stage container stays empty, so hide it:
     a visible empty full-screen container sits above the 3D view and swallows every mouse/touch event. */
  host.hidden = true;
  if (gameState.crew.length !== CREW_CONFIG.pick) gameState.crew = CREW_CONFIG.devDefault.slice();
  if (!gameState.outpost) gameState.outpost = createOutpost();

    white: (opacity, ms) => WhiteFade.to(opacity, ms),
    sfx: Sfx, powerOptions: RESOURCE_CONFIG.power.options, solarUnits: OUTPOST_CONFIG.solarUnits,
    /* Retry the Game: back to defaults, then the planet screen */
    retry: () => {
      Object.assign(gameState, { planet: null, crew: [] }); Object.assign(gameState.resources, { lifeSupport: null, radiationShield: null, power: null }); delete gameState.outpost;
      Stages.goTo(STAGES.findIndex((s) => s.id === 'planet'), { holdMs: FLOW.stepHoldMs });
    },
  });
  MuteButton.setInGame(true);
  return { unmount() { game.dispose(); Sfx.stopAll(); MuteButton.setInGame(false); } };
}

      float hash(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }

/* ---------------------------------------------------------------- input block + white fade */
const InputBlock = {

  push() { if (this.count++ === 0) for (const type of ['keydown', 'keyup', 'keypress']) window.addEventListener(type, this.stop, true); },
  pop() { if (this.count > 0 && --this.count === 0) for (const type of ['keydown', 'keyup', 'keypress']) window.removeEventListener(type, this.stop, true); },

  el: null, blocking: false,

  to(opacity, ms) {

/* ---------------------------------------------------------------- the launch stack (orbiter + tank + boosters) */

/* ---------------------------------------------------------------- the launch pad and the Florida coast */
function buildLaunchSite(kit, scene) {
  const C = LAUNCH_CONFIG, W = C.world, col = C.colors, M = kit.M, rnd = seeded(77);
  const conc = kit.std(col.concrete, { roughness: 0.95 }), dark = kit.std(col.trench, { roughness: 1 });

  for (let i = 0; i < gp.count; i++) {
    const x = gp.getX(i), z = gp.getZ(i);
    tmp.copy(land[0]).lerp(land[1], smooth(0.3, 0.8, Math.sin(x * 0.004) * Math.cos(z * 0.005) * 0.5 + 0.5)).lerp(land[2], rnd() * 0.35);

  const oceanGeo = new THREE.PlaneGeometry(W.oceanSize, W.oceanSize); oceanGeo.rotateX(-Math.PI / 2);
  const ocean = new THREE.Mesh(oceanGeo, new THREE.MeshStandardMaterial({ color: lin(col.ocean), roughness: 0.22, metalness: 0.25 }));
  ocean.position.set(W.coastX + W.oceanSize / 2, 0.15, 0); scene.add(ocean);
  /* raised pad, flame trench, crawlerway */
  kit.mesh(new THREE.CylinderGeometry(W.moundRadius, W.moundRadius + 10, W.padTop, 8), conc, { p: [0, W.padTop / 2, 0], r: [0, Math.PI / 8, 0], parent: scene, cast: false });
  kit.mesh(new THREE.BoxGeometry(W.moundRadius * 2 + 16, 0.2, 7), dark, { p: [0, W.padTop + 0.02, 0], parent: scene, cast: false });
  for (const zz of [-5, 5]) kit.mesh(new THREE.BoxGeometry(900, 0.3, 4), kit.std(col.road, { roughness: 1 }), { p: [-W.moundRadius - 450, 0.15, zz], parent: scene, cast: false });
  /* mobile launch platform */
  const deck = W.padTop + W.mlpPost + W.mlpHeight;
  kit.mesh(new THREE.BoxGeometry(26, W.mlpHeight, 22), kit.std(col.mlp, { roughness: 0.8 }), { p: [-1, W.padTop + W.mlpPost + W.mlpHeight / 2, 0], parent: scene });
  for (const x of [-12, 10]) for (const z of [-9, 9]) kit.mesh(new THREE.BoxGeometry(2, W.mlpPost, 2), conc, { p: [x, W.padTop + W.mlpPost / 2, z], parent: scene });
  kit.mesh(new THREE.BoxGeometry(26.1, 0.5, 22.1), M.orange, { p: [-1, deck - 0.6, 0], parent: scene, cast: false });
  /* fixed service tower with a lightning mast */
  const tw = new THREE.Group(); tw.position.set(W.towerX, W.padTop, W.towerZ); scene.add(tw);
  const tMat = kit.std(col.tower, { roughness: 0.6, metalness: 0.3 }), s2 = W.towerSize / 2;
  for (const x of [-s2, s2]) for (const z of [-s2, s2]) kit.mesh(new THREE.BoxGeometry(0.7, W.towerHeight, 0.7), tMat, { p: [x, W.towerHeight / 2, z], parent: tw });
  for (let y = 4; y <= W.towerHeight; y += 4) {
    kit.mesh(new THREE.BoxGeometry(W.towerSize + 0.8, 0.5, W.towerSize + 0.8), y % 12 === 0 ? kit.std(col.towerAccent) : tMat, { p: [0, y, 0], parent: tw });
    for (const [a, b] of [[[-s2, y - 4, s2], [s2, y, s2]], [[s2, y - 4, -s2], [-s2, y, -s2]], [[s2, y - 4, s2], [s2, y, -s2]]]) kit.rod(new kit.V3(...a), new kit.V3(...b), 0.12, tMat, tw);

  kit.mesh(new THREE.BoxGeometry(2.2, 2.4, 2.4), kit.std('#f1eee8'), { p: [W.armLength + 0.4, 0.4, 0], parent: arm });
  /* water tower */

  for (const [x, z] of [[-4, -4], [4, -4], [-4, 4], [4, 4]]) kit.rod(new kit.V3(x, 0, z), new kit.V3(x * 0.6, 34, z * 0.6), 0.45, tMat, wt);
  kit.mesh(new THREE.CylinderGeometry(6, 6, 10, 28), kit.std('#f1eee8'), { p: [0, 39, 0], parent: wt });
  kit.mesh(new THREE.SphereGeometry(6, 28, 14, 0, Math.PI * 2, 0, Math.PI / 2), kit.std('#f1eee8'), { p: [0, 44, 0], parent: wt });
  kit.mesh(new THREE.CylinderGeometry(6.05, 6.05, 1.2, 28), kit.std(col.towerAccent), { p: [0, 36, 0], parent: wt });
  /* Vehicle Assembly Building, far inland */
  const [vw, vh, vd] = W.vabSize;
  const vabTex = canvasTexture(256, 256, (g, w, h) => { g.fillStyle = col.vab; g.fillRect(0, 0, w, h); g.fillStyle = 'rgba(80,86,96,0.25)'; for (let x = 0; x < w; x += 8) g.fillRect(x, 0, 1, h); g.fillStyle = col.vabDoor; g.fillRect(w * 0.38, h * 0.12, w * 0.24, h * 0.88); });
  kit.mesh(new THREE.BoxGeometry(vw, vh, vd), kit.std('#ffffff', { map: vabTex, roughness: 0.9 }), { p: [W.vab[0], vh / 2, W.vab[1]], parent: scene });
  kit.mesh(new THREE.BoxGeometry(vw * 0.9, vh * 0.3, vd * 0.6), kit.std(col.vab, { roughness: 0.9 }), { p: [W.vab[0] + vw * 0.9, vh * 0.15, W.vab[1] + vd * 0.1], parent: scene });

    const s = 2 + rnd() * 5; sc.set(s * 1.4, s * 0.7, s * 1.3); ps.set(x, s * 0.3, z); q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rnd() * 6);

}

/* ---------------------------------------------------------------- smoke + water particles (one Points system) */
function makeParticles(maxCount) {
  const pos = new Float32Array(maxCount * 3), colr = new Float32Array(maxCount * 3), size = new Float32Array(maxCount), alpha = new Float32Array(maxCount);
  const vel = new Float32Array(maxCount * 3), life = new Float32Array(maxCount), maxLife = new Float32Array(maxCount), s0 = new Float32Array(maxCount), s1 = new Float32Array(maxCount),
    a0 = new Float32Array(maxCount), grav = new Float32Array(maxCount), drag = new Float32Array(maxCount), glow = new Float32Array(maxCount);
  const base = new Float32Array(maxCount * 3), hot = new Float32Array(maxCount * 3);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('aColor', new THREE.BufferAttribute(colr, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1)); geo.setAttribute('aAlpha', new THREE.BufferAttribute(alpha, 1));
  const tex = canvasTexture(128, 128, (g) => { const rr = seeded(3); for (let i = 0; i < 9; i++) { const x = 40 + rr() * 48, y = 40 + rr() * 48, r = 22 + rr() * 22, gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(255,255,255,0.8)'); gr.addColorStop(0.6, 'rgba(255,255,255,0.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); } });
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, fog: false,
    uniforms: { uMap: { value: tex }, uScale: { value: innerHeight }, uLight: { value: 1 } },
    vertexShader: 'attribute float aSize; attribute float aAlpha; attribute vec3 aColor; uniform float uScale; varying float vA; varying vec3 vC; void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_Position = projectionMatrix * mv; gl_PointSize = min(aSize * uScale / max(0.1, -mv.z), 900.0); vA = aAlpha; vC = aColor; }',
    fragmentShader: 'uniform sampler2D uMap; uniform float uLight; varying float vA; varying vec3 vC; void main(){ vec4 t = texture2D(uMap, gl_PointCoord); float a = t.a * vA; if (a < 0.004) discard; gl_FragColor = vec4(vC * uLight, a); \n#include <tonemapping_fragment>\n#include <encodings_fragment>\n}',
  });
  const points = new THREE.Points(geo, mat); points.frustumCulled = false; points.renderOrder = 4;
  let head = 0;
  const api = {
    points, maxCount,
    emit(x, y, z, vx, vy, vz, o) {
      const i = head; head = (head + 1) % maxCount;
      pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z; vel[i * 3] = vx; vel[i * 3 + 1] = vy; vel[i * 3 + 2] = vz;
      life[i] = 0; maxLife[i] = o.life; s0[i] = o.s0; s1[i] = o.s1; a0[i] = o.alpha; grav[i] = o.gravity || 0; drag[i] = o.drag || 0.6; glow[i] = o.glowFor || 0;
      base[i * 3] = o.color.r; base[i * 3 + 1] = o.color.g; base[i * 3 + 2] = o.color.b;
      const h = o.glow || o.color; hot[i * 3] = h.r; hot[i * 3 + 1] = h.g; hot[i * 3 + 2] = h.b;
    },
    update(dt) {
      for (let i = 0; i < maxCount; i++) {
        if (maxLife[i] <= 0) { alpha[i] = 0; continue; }
        life[i] += dt; const k = life[i] / maxLife[i];
        if (k >= 1) { maxLife[i] = 0; alpha[i] = 0; continue; }
        const dr = Math.exp(-drag[i] * dt);
        vel[i * 3] *= dr; vel[i * 3 + 2] *= dr; vel[i * 3 + 1] = vel[i * 3 + 1] * dr - grav[i] * dt;
        pos[i * 3] += vel[i * 3] * dt; pos[i * 3 + 1] += vel[i * 3 + 1] * dt; pos[i * 3 + 2] += vel[i * 3 + 2] * dt;
        size[i] = lerp(s0[i], s1[i], 1 - Math.pow(1 - k, 2));
        alpha[i] = a0[i] * Math.min(1, k * 8) * (1 - k);
        const hk = glow[i] > 0 ? 1 - clamp01(life[i] / glow[i]) : 0;
        colr[i * 3] = lerp(base[i * 3], hot[i * 3], hk); colr[i * 3 + 1] = lerp(base[i * 3 + 1], hot[i * 3 + 1], hk); colr[i * 3 + 2] = lerp(base[i * 3 + 2], hot[i * 3 + 2], hk);
      }
      for (const a of ['position', 'aColor', 'aSize', 'aAlpha']) geo.attributes[a].needsUpdate = true;
    },
  };
  return api;
}

  skyMat.uniforms.uSpaceTop.value.copy(skyCols.sTop); skyMat.uniforms.uSpaceHor.value.copy(skyCols.sHor); skyMat.uniforms.uSunDir.value.copy(sunDir); skyMat.uniforms.uSunCol.value.copy(lin(SK.sunGlow));

  scene.fog = new THREE.Fog(skyCols.hor.clone(), C.fog.near, C.fog.far);
  { const env = new THREE.Scene(), envSky = new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), skyMat.clone()); envSky.material.uniforms = THREE.UniformsUtils.clone(skyMat.uniforms); env.add(envSky);
    const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(env, 0.04).texture; pm.dispose(); disposeThreeObject(env); }
  const hemi = new THREE.HemisphereLight(lin(C.hemi.sky), lin(C.hemi.ground), C.hemi.intensity); scene.add(hemi);
  const sun = new THREE.DirectionalLight(lin(C.sun.color), C.sun.intensity);

  const stack = buildLaunchStack(kit);

  pivot.position.set(0, site.deck, 0);
  const earth = new THREE.Group(); earth.visible = false; scene.add(earth);
  const earthTex = makeEarthTexture();
  const earthMesh = new THREE.Mesh(new THREE.SphereGeometry(C.earth.radius, 96, 64), new THREE.MeshStandardMaterial({ map: earthTex, roughness: 0.85, metalness: 0, fog: false, transparent: true }));
  earth.add(earthMesh, makeAtmosphere(C.earth.radius, C.earth.atmoScale, C.earth.atmo, C.earth.atmoStrength));
  const P = C.particles, parts = makeParticles(P.smokeCount + P.waterCount); scene.add(parts.points);
  const pc = { water: lin(P.water.color), steam: lin(P.steam.color), ground: lin(P.ground.color), groundGlow: lin(P.ground.glow), trail: lin(P.trail.color), trailGlow: lin(P.trail.glow) };
  const rate = { water: 0, steam: 0, ground: 0, trail: 0 };
  const range = (r) => lerp(r[0], r[1], Math.random());

  /* cue + caption state */
  let cueIdx = 0, captionText = '', countShown = '';
  const rocketSfx = Sfx.rocket(); let thumps = 0;
  const fireCue = (cue) => {
    const txt = STRINGS[cue.textKey];
    if (cue.display === 'countdown') { countShown = txt; ui.count.textContent = ui.count.dataset.text = txt; ui.count.classList.remove('on'); void ui.count.offsetWidth; ui.count.classList.add('on'); }
    else { captionText = txt; setText(ui.caption, txt); ui.caption.classList.add('on'); }

  /* camera rig */
  const cam = { pos: new THREE.Vector3(), look: new THREE.Vector3(), off: new THREE.Vector3(), lookOff: new THREE.Vector3(), shot: -1 };
  const v1 = new THREE.Vector3(), v2 = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0), qTmp = new THREE.Quaternion();
  const shotAt = (t) => { let k = 0; C.camera.shots.forEach((s, i) => { if (t >= s.from) k = i; }); return k; };
  const stackPoint = (offArr, out) => out.set(offArr[0], offArr[1], offArr[2]).applyMatrix4(roll.matrixWorld);

  let t = 0, last = performance.now(), raf = 0, ended = false, hidden = document.hidden;
  const onVis = () => { hidden = document.hidden; if (hidden) { Sound.pause(); Sfx.suspend(); } else { Sound.resume(); Sfx.resume(); } };
  document.addEventListener('visibilitychange', onVis);
  const onResize = () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); parts.points.material.uniforms.uScale.value = innerHeight * renderer.getPixelRatio(); };
  window.addEventListener('resize', onResize); onResize();

  const frame = (now) => {
    const dt = hidden ? 0 : Math.min((now - last) / 1000, 0.05); last = now; t += dt;
    const tau = t - T.liftoff, lifted = tau >= 0;
    /* --- cues --- */
    while (cueIdx < C.cues.length && t >= C.cues[cueIdx].time) fireCue(C.cues[cueIdx++]);
    if (t >= T.liftoff && countShown) { countShown = ''; ui.count.classList.remove('on'); }
    ui.lower.classList.toggle('on', t >= C.lowerThird[0] && t < C.lowerThird[1]);
    if (t >= C.whiteStart) ui.caption.classList.remove('on');
    /* --- flight --- */
    const PA = C.path;
    if (lifted) {
      pivot.position.set(interpSmooth(PA.t, PA.x, tau, true), site.deck + interpSmooth(PA.t, PA.y, tau, true), 0);
      pivot.rotation.z = -deg(interpSmooth(PA.t, PA.tilt, tau, false));
      roll.rotation.y = deg(interpSmooth(PA.t, PA.roll, tau, false));
    } else {

    }
    /* crew arm swings away before the countdown */
    site.arm.rotation.y = smooth(T.armSwing[0], T.armSwing[1], t) * deg(70);
    /* engines */
    const ssmeI = t < T.engines ? 0 : t < T.meco ? (smooth(T.engines, T.enginesFull, t) * 0.85 + 0.15 * smooth(T.liftoff - 0.5, T.liftoff, t)) * (t >= T.maxQ ? C.flames.maxQThrottle : 1) : 1 - smooth(T.meco, T.meco + 0.4, t);
    const srbI = t < T.liftoff ? 0 : (t < T.maxQ ? 1 : C.flames.maxQThrottle) * (1 - smooth(T.srbBurnout, T.boosterSep, t));
    const flick = 1 + Math.sin(t * 61) * C.flames.flicker + Math.sin(t * 37) * C.flames.flicker * 0.6;
    for (const p of stack.ssme) { p.material.uniforms.uI.value = ssmeI; p.material.uniforms.uTime.value = t; p.scale.set(C.flames.ssme.radius * p.userData.s, C.flames.ssme.length * Math.max(ssmeI, CINEMA.nearZero) * flick * p.userData.s, C.flames.ssme.radius * p.userData.s); p.visible = ssmeI > 0.01; }
    for (const b of stack.srbs) {
      b.plume.material.uniforms.uI.value = srbI; b.plume.material.uniforms.uTime.value = t; b.plume.visible = srbI > 0.01;
      b.plume.scale.set(C.flames.srb.radius, C.flames.srb.length * Math.max(srbI, CINEMA.nearZero) * flick, C.flames.srb.radius);
      b.glow.material.opacity = srbI; b.glow.scale.setScalar(9 * srbI * flick + CINEMA.nearZero);
      /* booster separation */
      const ts = t - T.boosterSep, SP = C.separation;
      if (ts > 0) {
        b.group.position.set(b.base.x, b.base.y - (SP.srbFall[0] * ts + SP.srbFall[1] * ts * ts), b.base.z + b.side * (SP.srbOut[0] * ts + SP.srbOut[1] * ts * ts));
        b.group.rotation.set(b.side * SP.srbTumble * ts, 0, SP.srbTumble * 0.4 * ts);
      }
    }
    const tsEt = t - T.etSep;
    if (tsEt > 0) { const SP = C.separation; stack.et.position.set(SP.etOut[0] * tsEt + SP.etOut[1] * tsEt * tsEt, stack.dims.etY - (SP.etFall[0] * tsEt + SP.etFall[1] * tsEt * tsEt), 0); stack.et.rotation.set(0, 0.12 * tsEt, -SP.etTumble * tsEt); }
    stack.light.intensity = C.flames.light.intensity * Math.max(srbI, ssmeI * 0.4) * flick;
    /* --- readings --- */
    const M = C.mission, km = lifted ? interpLinear(M.t, M.km, tau) : 0, kmh = lifted ? interpLinear(M.t, M.kmh, tau) : 0;
    setText(ui.clock, lifted ? tFmt('clockPlus', mmss(interpLinear(M.t, M.s, tau))) : tFmt('clockMinus', mmss(t < T.liftoff - C.countdownFrom ? C.countdownFrom : Math.ceil(T.liftoff - t))));
    setText(ui.alt, `${km < 10 ? km.toFixed(1) : fmtInt(km)} ${STRINGS.km}`);
    setText(ui.spd, `${fmtInt(kmh)} ${STRINGS.kmh}`);
    ui.sped.hidden = !lifted;
    for (const r of C.systems) {
      const cell = ui.rows[r.label];
      if (r.fixed) { setText(cell, STRINGS[r.fixed]); continue; }
      if (r.percent) { const v = Math.round(interpLinear(r.percent.t, r.percent.v, t)); setText(cell, v + '%'); cell.className = v >= 100 ? 'good' : 'wait'; continue; }
      let st = r.states[0]; for (const s of r.states) if (t >= s[0]) st = s;
      setText(cell, STRINGS[st[1]]); if (cell.className !== st[2]) cell.className = st[2];
    }
    /* --- sky: dawn → space with altitude --- */
    const space = Math.pow(smooth(SK.spaceKm[0], SK.spaceKm[1], km), 0.8), stars = smooth(SK.starsKm[0], SK.starsKm[1], km);
    skyMat.uniforms.uSpace.value = space; skyMat.uniforms.uStars.value = stars;
    scene.fog.color.copy(skyCols.hor).lerp(skyCols.sHor, space);
    scene.fog.far = C.fog.far / Math.max(0.02, 1 - space);
    hemi.intensity = lerp(C.hemi.intensity, C.hemi.spaceIntensity, space);
    for (const g of site.groundGroup) g.visible = space < 0.985;
    const eIn = smooth(T.earthIn[0], T.earthIn[1], t); earth.visible = eIn > 0.001; earthMesh.material.opacity = eIn;
    earth.children[1].material.uniforms.uStrength.value = C.earth.atmoStrength * eIn;
    earth.position.set(pivot.position.x, pivot.position.y - C.earth.radius - C.earth.below, 0); earth.rotation.y = t * 0.01;
    /* --- particles --- */

    });

    });

      const a = Math.random() * Math.PI * 2, sp = range(P.ground.speed);
      parts.emit(Math.cos(a) * 4, Wd.padTop + 3, Math.sin(a) * 4, Math.cos(a) * sp, 2 + Math.random() * 4, Math.sin(a) * sp * 0.8, { life: range(P.ground.life), s0: P.ground.size[0], s1: P.ground.size[1], alpha: P.ground.alpha, gravity: -0.8, drag: 0.4, color: pc.ground, glow: pc.groundGlow, glowFor: 1.2 });
    });
    if (srbI > 0.2) {

        v1.set(0, -3.5, 0).applyMatrix4(b.group.matrixWorld);
        v2.set((Math.random() - 0.5) * 2, -8, (Math.random() - 0.5) * 2).applyQuaternion(roll.getWorldQuaternion(qTmp));
        parts.emit(v1.x, v1.y, v1.z, v2.x, v2.y, v2.z, { life: range(P.trail.life), s0: P.trail.size[0], s1: P.trail.size[1], alpha: P.trail.alpha, drag: 0.8, color: pc.trail, glow: pc.trailGlow, glowFor: 0.6 });

    parts.update(dt);
    /* --- flash --- */

    /* --- camera --- */
    scene.updateMatrixWorld(true);
    const si = shotAt(t), shot = C.camera.shots[si], nextFrom = C.camera.shots[si + 1] ? C.camera.shots[si + 1].from : C.whiteStart + 1;
    const cut = si !== cam.shot && (cam.shot < 0 || shot.cut || shot.mode !== C.camera.shots[cam.shot].mode);
    if (shot.mode === 'ground') {
      const k = smooth(shot.from, nextFrom, t);
      v1.set(lerp(shot.pos[0], shot.to[0], k), lerp(shot.pos[1], shot.to[1], k), lerp(shot.pos[2], shot.to[2], k));

    unmount() {

      document.removeEventListener('visibilitychange', onVis); window.removeEventListener('resize', onResize);
      disposeThreeObject(scene); if (scene.environment) scene.environment.dispose();
      Object.values(kit.Tex).forEach((tx) => tx.dispose());
      renderer.dispose(); renderer.forceContextLoss();
    },
  };
}

/* ---------------------------------------------------------------- stage: APPROACH */
function mountApproach(host, ctx) {
  const A = APPROACH_CONFIG, target = A.targets[gameState.planet] || A.targets.mars, planetName = STRINGS[target.nameKey];
  const canvas = el('canvas', 'dg-cine-canvas'); host.appendChild(canvas);
  const hud = el('div', 'dg-cine');
  const title = tFmt('approaching', planetName);
  hud.innerHTML = `
    <h2 class="dg-cine-title dg-glow-text" data-text="${esc(title)}">${esc(title)}</h2>
    <section class="dg-readout left"><div class="dg-readout-box"><h3>${esc(tFmt('distanceTo', planetName.toUpperCase()))}</h3><div class="big" data-k="dist"></div></div><div class="tiny">${esc(STRINGS.simplified)}</div></section>
    <section class="dg-readout right"><div class="dg-readout-box"><h3>${esc(STRINGS.speed)}</h3><div class="big">${esc(fmtInt(A.speedKmh) + ' ' + STRINGS.kmh)}</div></div><div class="tiny">${esc(STRINGS.simplified)}</div></section>`;
  host.appendChild(hud);
  const distEl = hud.querySelector('[data-k="dist"]');

  const renderer = makeCineRenderer(canvas, A.dprCap);
  const kit = createFrontierKit(THREE, Math.min(8, renderer.capabilities.getMaxAnisotropy()));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(A.fov, innerWidth / innerHeight, 0.05, 50000);
  const skyMat = makeSkyMaterial(); skyMat.uniforms.uSpace.value = 1; skyMat.uniforms.uStars.value = 1;
  skyMat.uniforms.uSpaceTop.value.copy(lin(LAUNCH_CONFIG.sky.spaceTop)); skyMat.uniforms.uSpaceHor.value.copy(lin(LAUNCH_CONFIG.sky.spaceTop));
  const sunDir = new THREE.Vector3(...A.sun.dir).normalize(); skyMat.uniforms.uSunDir.value.copy(sunDir.clone().negate()); skyMat.uniforms.uSunCol.value.set(0, 0, 0);
  const sky = new THREE.Mesh(new THREE.SphereGeometry(20000, 48, 24), skyMat); sky.frustumCulled = false; sky.renderOrder = -10; scene.add(sky);
  { const env = new THREE.Scene(), envSky = new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), new THREE.MeshBasicMaterial({ color: lin('#2a3352'), side: THREE.BackSide })); env.add(envSky);
    const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(env, 0.04).texture; pm.dispose(); disposeThreeObject(env); }
  scene.add(new THREE.AmbientLight(lin(A.ambient.color), A.ambient.intensity));
  const sun = new THREE.DirectionalLight(lin(A.sun.color), A.sun.intensity); sun.position.copy(sunDir).multiplyScalar(100); scene.add(sun);
  const orbiter = kit.buildShuttle({ gear: false, stairs: false }); scene.add(orbiter);
  const planet = new THREE.Group(); scene.add(planet);
  const pMesh = new THREE.Mesh(new THREE.SphereGeometry(target.radius, 96, 64), new THREE.MeshStandardMaterial({ map: makePlanetTexture(target.texture), roughness: 1, metalness: 0 }));
  pMesh.rotation.z = PLANET_CONFIG.planets[target.texture].tilt; planet.add(pMesh);
  if (target.atmo) planet.add(makeAtmosphere(target.radius, target.atmoScale, target.atmo, target.atmoStrength));
  const camBase = new THREE.Vector3(...A.camera.local), fwd = new THREE.Vector3(), e = new THREE.Euler();
  const onResize = () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); };
  window.addEventListener('resize', onResize); onResize();
  let t = 0, last = performance.now(), raf = 0, ended = false, hidden = document.hidden, running = false;   // clock starts on reveal
  let thruster = NULL_SOUND, nextPuff = 0;
  const onVis = () => { hidden = document.hidden; if (hidden) Sfx.suspend(); else Sfx.resume(); };
  document.addEventListener('visibilitychange', onVis);
  const frame = (now) => {
    const dt = hidden || !running ? 0 : Math.min((now - last) / 1000, 0.05); last = now; t += dt;
    const k = clamp01(t / A.durationSec), grow = Math.pow(k, A.growPower);
    /* camera on top of the orbiter, looking toward the nose, with a gentle vibration */
    const V = A.camera, vib = V.vibration;
    camera.position.set(camBase.x + Math.sin(t * V.vibHz[0]) * vib, camBase.y + Math.sin(t * V.vibHz[1] + 1) * vib, camBase.z + Math.cos(t * V.vibHz[0] * 0.7) * vib);
    e.set(deg(Math.sin(t * 1.3) * V.rollDeg), -Math.PI / 2, 0, 'YXZ'); camera.quaternion.setFromEuler(e);
    camera.rotateX(deg(V.pitchDeg));
    /* destination ahead, growing steadily (ease-in on its angular size) */
    const ang = lerp(A.angle[0], A.angle[1], grow), dist = target.radius / Math.tan(ang / 2);
    fwd.set(1, Math.tan(deg(A.planetElevDeg)), 0).normalize();
    planet.position.copy(camBase).addScaledVector(fwd, dist);
    pMesh.rotation.y = t * target.spin;
    sky.position.copy(camera.position); sky.rotation.y = t * A.starDrift; sky.rotation.z = t * A.starDrift * 0.3;
    setText(distEl, `${fmtInt(lerp(target.startKm, target.endKm, grow))} ${STRINGS.km}`);
    /* thruster hum with small attitude-thruster puffs, faded in and out */
    const SA = SFX_CONFIG.approach;
    thruster.set(smooth(0, SA.fadeIn, t) * (1 - smooth(A.durationSec - SA.fadeOut, A.durationSec, t)));
    if (running && t >= nextPuff) { if (t > 0) thruster.puff(); nextPuff = t + lerp(SA.puffEvery[0], SA.puffEvery[1], Math.random()); }
    renderer.render(scene, camera);
    if (!ended && t >= A.durationSec) { ended = true; ctx.next(); }
    raf = requestAnimationFrame(frame);
  };
  raf = requestAnimationFrame((n) => { last = n; frame(n); });
  return {
    onReveal() { running = true; thruster = Sfx.approach(); },
    unmount() {
      cancelAnimationFrame(raf); Sound.stop(); thruster.stop();
      document.removeEventListener('visibilitychange', onVis); window.removeEventListener('resize', onResize);
      disposeThreeObject(scene); if (scene.environment) scene.environment.dispose();
      Object.values(kit.Tex).forEach((tx) => tx.dispose());
      renderer.dispose(); renderer.forceContextLoss();
    },
  };
}

/* ---------------------------------------------------------------- stage manager */
/* The flow, in order. Later phases insert stages (launch, flight) between 'resources' and 'game'. */
/* exit: how the flow leaves a stage. 'clouds' (default, holdMs), 'whiteClouds' (white → clouds with loading), 'white' (white flash). */
const STAGES = [
  { id: 'start',     mount: mountStart,     exit: { kind: 'clouds', holdMs: FLOW.loadingHoldMs } },
  { id: 'planet',    mount: mountPlanet,    devState: () => {} },
  { id: 'crew',      mount: mountCrew,      devState: () => { gameState.planet = 'mars'; } },
  { id: 'resources', mount: mountResources, devState: () => { gameState.crew = CREW_CONFIG.devDefault.slice(); } },
  { id: 'launch',    mount: mountLaunch,    exit: { kind: 'whiteClouds' }, devState: () => { Object.assign(gameState.resources, RESOURCE_CONFIG.devDefault); } },
  { id: 'approach',  mount: mountApproach,  exit: { kind: 'white' } },
  { id: 'game',      mount: mountGame },
];
const Stages = {
  index: -1, current: null,
  ctx: { gameState, next: () => Stages.next() },
  mountAt(i) {
    if (this.current) { this.current.unmount(); this.current = null; }   // old stage is disposed first: one render loop at a time
    const host = el('div', 'dg-stage'); host.dataset.stage = STAGES[i].id; document.body.appendChild(host);
    const inst = STAGES[i].mount(host, this.ctx) || {};
    this.index = i;
    this.current = { inst, unmount() { if (inst.unmount) inst.unmount(); host.remove(); } };
    return inst;
  },
  busy: false,
  next() {
    const exit = STAGES[this.index].exit || { kind: 'clouds' }, i = this.index + 1;
    if (exit.kind === 'whiteClouds') return this.goWhiteClouds(i);
    if (exit.kind === 'white') return this.goWhite(i);
    return this.goTo(i, { holdMs: exit.holdMs ?? FLOW.stepHoldMs });
  },
  /* white fades in → clouds already closed underneath → white fades out → 'Loading…' hold → clouds open */
  async goWhiteClouds(i) {
    if (this.busy || CloudTransition.busy || i >= STAGES.length) return;
    this.busy = true;
    const W = CINEMA.white; let inst = null;
    await WhiteFade.to(1, W.inMs);
    await CloudTransition.go(async () => { inst = this.mountAt(i); await nextFrame(); await WhiteFade.to(0, W.outMs); },
      { startClosed: true, holdMs: CINEMA.approachLoadingHoldMs, holdFrom: 'swap' });
    this.busy = false;
    if (inst && inst.onReveal) inst.onReveal();
  },
  /* white fades in → short hold → next stage mounts → white fades out */
  async goWhite(i) {
    if (this.busy || CloudTransition.busy || i >= STAGES.length) return;
    this.busy = true;
    const W = CINEMA.white;
    await WhiteFade.to(1, W.inMs); await sleep(W.gameHoldMs);
    const inst = this.mountAt(i); await nextFrame();
    await WhiteFade.to(0, W.outMs);
    this.busy = false;
    if (inst.onReveal) inst.onReveal();
  },
  goTo(i, opts) {
    if (i < 0 || i >= STAGES.length || CloudTransition.busy || this.busy) return CloudTransition.busy || Promise.resolve();
    let inst = null;
    return CloudTransition.go(() => { inst = this.mountAt(i); return inst.ready; }, opts).then(() => { if (inst && inst.onReveal) inst.onReveal(); });
  },
  /* dev only: jump straight to a stage with default state filled in for the stages before it */
  devJump(i) {
    for (let k = 1; k <= i; k++) if (STAGES[k].devState) STAGES[k].devState();
    const inst = this.mountAt(i); if (inst.onReveal) inst.onReveal();
  },
};

/* ---------------------------------------------------------------- boot */
applyTheme();
Sound.init();
CloudTransition.init();
WhiteFade.init();
MuteButton.init();
/* #dev=planet | crew | resources | launch | approach | game (also #dev-planet, which survives hosts that strip "=" from links) */
const dev = /^#dev[=-](\w+)$/.exec(location.hash);
const devSol = dev && /^sol([1-4])$/.exec(dev[1]);   // #dev=sol2 … #dev=sol4: straight into that Sol (testing only)
if (devSol) gameState.devSol = +devSol[1];
const devIndex = dev ? STAGES.findIndex((s) => s.id === (devSol ? 'game' : dev[1]) && s.id !== 'start') : -1;
if (devIndex > 0) Stages.devJump(devIndex); else Stages.mountAt(0);
(window.requestIdleCallback || ((f) => setTimeout(f, 200)))(() => CloudTransition.prepare());

window.Digonto = {
  gameState, STAGES, CloudTransition,
  goTo: (id, opts) => Stages.goTo(STAGES.findIndex((s) => s.id === id), opts || { holdMs: FLOW.stepHoldMs }),
  get stage() { return STAGES[Stages.index] && STAGES[Stages.index].id; },
  get busy() { return Stages.busy || !!CloudTransition.busy; },
  LAUNCH_CONFIG, APPROACH_CONFIG, Sound,
};
})();
</script>
